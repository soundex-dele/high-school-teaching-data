id: history.senior-high.song-yuan
subject: history
education_stage: senior_high
name: 辽宋夏金多民族政权的并立与元朝的统一
summary: 本知识点围绕多民族政权并立与统一展开，重点是从政治、经济和文化互动理解宋元时期统一趋势与社会变化，并能在新的问题情境中说明条件、过程与结论之间的联系。
objectives:
- 从政治、经济和文化互动理解宋元时期统一趋势与社会变化
- 能够识别典型条件并用规范语言说明判断依据
prerequisites:
- 初中阶段相关基础知识
- 基本阅读、表达与推理能力
common_mistakes:
- 只用单一政权视角解释多民族互动
keywords:
