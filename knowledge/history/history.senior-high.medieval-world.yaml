id: history.senior-high.medieval-world
subject: history
education_stage: senior_high
name: 中古时期的世界
summary: 本知识点围绕中古世界的区域发展展开，重点是比较欧洲、亚洲和非洲、美洲不同区域的政治经济文化，并能在新的问题情境中说明条件、过程与结论之间的联系。
objectives:
- 比较欧洲、亚洲和非洲、美洲不同区域的政治经济文化
- 能够识别典型条件并用规范语言说明判断依据
prerequisites:
- 初中阶段相关基础知识
- 基本阅读、表达与推理能力
common_mistakes:
- 把中古世界等同于欧洲历史
keywords:
- 中古世界的区域发展
- 中古时期的世界
competency_tags:
- 时空观念
- 史料实证
- 历史解释
