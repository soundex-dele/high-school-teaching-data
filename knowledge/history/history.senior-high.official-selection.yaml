id: history.senior-high.official-selection
subject: history
education_stage: senior_high
name: 官员的选拔与管理
summary: 本知识点围绕选官与官员管理展开，重点是梳理中外官员选拔、考核和监察制度的演进与影响，并能在新的问题情境中说明条件、过程与结论之间的联系。
objectives:
- 梳理中外官员选拔、考核和监察制度的演进与影响
- 能够识别典型条件并用规范语言说明判断依据
prerequisites:
- 初中阶段相关基础知识
- 基本阅读、表达与推理能力
common_mistakes:
- 把制度规定等同于实际执行效果
keywords:
- 选官与官员管理
- 官员的选拔与管理
competency_tags:
