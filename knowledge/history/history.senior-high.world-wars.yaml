id: history.senior-high.world-wars
subject: history
education_stage: senior_high
name: 两次世界大战与国际秩序的演变
summary: 本知识点围绕世界大战与国际秩序展开，重点是从矛盾演变、战争进程和战后安排理解国际秩序变化，并能在新的问题情境中说明条件、过程与结论之间的联系。
objectives:
- 从矛盾演变、战争进程和战后安排理解国际秩序变化
- 能够识别典型条件并用规范语言说明判断依据
prerequisites:
- 初中阶段相关基础知识
- 基本阅读、表达与推理能力
common_mistakes:
- 只用单一事件解释战争爆发
keywords:
- 世界大战与国际秩序
- 两次世界大战与国际秩序的演变
competency_tags:
- 时空观念
- 史料实证
- 历史解释
