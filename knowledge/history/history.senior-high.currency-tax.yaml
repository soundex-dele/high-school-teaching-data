id: history.senior-high.currency-tax
subject: history
education_stage: senior_high
name: 货币与赋税制度
summary: 本知识点围绕货币、财政与国家治理展开，重点是分析货币形态和赋税制度变化对经济社会及国家治理的影响，并能在新的问题情境中说明条件、过程与结论之间的联系。
objectives:
- 分析货币形态和赋税制度变化对经济社会及国家治理的影响
- 能够识别典型条件并用规范语言说明判断依据
prerequisites:
- 初中阶段相关基础知识
- 基本阅读、表达与推理能力
common_mistakes:
- 只记税种名称而忽略征收基础变化
keywords:
- 货币、财政与国家治理
- 货币与赋税制度
competency_tags:
- 时空观念
- 史料实证
- 历史解释
