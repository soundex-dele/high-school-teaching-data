id: history.senior-high.anti-japanese-liberation
subject: history
education_stage: senior_high
name: 中华民族的抗日战争和人民解放战争
summary: 本知识点围绕民族抗战与人民解放展开，重点是从全民族抗战和中国共产党作用理解民族独立与人民解放进程，并能在新的问题情境中说明条件、过程与结论之间的联系。
objectives:
- 从全民族抗战和中国共产党作用理解民族独立与人民解放进程
- 能够识别典型条件并用规范语言说明判断依据
prerequisites:
- 初中阶段相关基础知识
- 基本阅读、表达与推理能力
common_mistakes:
- 忽视正面战场和敌后战场的相互配合
keywords:
- 民族抗战与人民解放
- 中华民族的抗日战争和人民解放战争
competency_tags:
- 时空观念
- 史料实证
- 历史解释
