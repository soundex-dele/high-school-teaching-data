id: history.senior-high.law-education
subject: history
education_stage: senior_high
name: 法律与教化
summary: 本知识点围绕法律体系与社会教化展开，重点是比较法律和教化在国家治理中的作用及互动，并能在新的问题情境中说明条件、过程与结论之间的联系。
objectives:
- 比较法律和教化在国家治理中的作用及互动
- 能够识别典型条件并用规范语言说明判断依据
prerequisites:
- 初中阶段相关基础知识
- 基本阅读、表达与推理能力
common_mistakes:
- 把法律与教化理解为彼此排斥
keywords:
- 法律体系与社会教化
- 法律与教化
competency_tags:
- 时空观念
- 史料实证
- 历史解释
