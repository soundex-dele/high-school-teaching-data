id: history.senior-high.late-qing
subject: history
education_stage: senior_high
name: 晚清时期的内忧外患与救亡图存
summary: 本知识点围绕民族危机与近代探索展开，重点是结合列强侵略、社会变动和救亡实践理解近代中国转型的艰难，并能在新的问题情境中说明条件、过程与结论之间的联系。
objectives:
- 结合列强侵略、社会变动和救亡实践理解近代中国转型的艰难
- 能够识别典型条件并用规范语言说明判断依据
prerequisites:
- 初中阶段相关基础知识
- 基本阅读、表达与推理能力
common_mistakes:
- 孤立评价某次探索而忽略时代条件和连续性
keywords:
- 民族危机与近代探索
- 晚清时期的内忧外患与救亡图存
competency_tags:
- 时空观念
- 史料实证
- 历史解释
