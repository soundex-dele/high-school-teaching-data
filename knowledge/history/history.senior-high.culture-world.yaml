id: history.senior-high.culture-world
subject: history
education_stage: senior_high
name: 丰富多样的世界文化
summary: 本知识点围绕世界文化的多样性展开，重点是比较不同区域文化形成条件、主要成就和历史影响，并能在新的问题情境中说明条件、过程与结论之间的联系。
objectives:
- 比较不同区域文化形成条件、主要成就和历史影响
- 能够识别典型条件并用规范语言说明判断依据
prerequisites:
- 初中阶段相关基础知识
- 基本阅读、表达与推理能力
common_mistakes:
- 用单一文化尺度评价所有文明
keywords:
- 世界文化的多样性
- 丰富多样的世界文化
competency_tags:
- 时空观念
- 史料实证
- 历史解释
