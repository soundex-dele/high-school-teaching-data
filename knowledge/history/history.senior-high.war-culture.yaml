id: history.senior-high.war-culture
subject: history
education_stage: senior_high
name: 战争与文化交锋
summary: 本知识点围绕战争中的文化互动展开，重点是辩证分析战争对文化破坏、传播和重构的复杂影响，并能在新的问题情境中说明条件、过程与结论之间的联系。
objectives:
- 辩证分析战争对文化破坏、传播和重构的复杂影响
- 能够识别典型条件并用规范语言说明判断依据
prerequisites:
- 初中阶段相关基础知识
- 基本阅读、表达与推理能力
common_mistakes:
- 把战争影响简单概括为单向传播
keywords:
- 战争中的文化互动
- 战争与文化交锋
competency_tags:
- 时空观念
- 史料实证
- 历史解释
