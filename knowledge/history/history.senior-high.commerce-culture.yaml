id: history.senior-high.commerce-culture
subject: history
education_stage: senior_high
name: 商路、贸易与文化交流
summary: 本知识点围绕贸易网络与文化传播展开，重点是理解陆海商路和贸易活动在跨区域文化交流中的作用，并能在新的问题情境中说明条件、过程与结论之间的联系。
objectives:
- 理解陆海商路和贸易活动在跨区域文化交流中的作用
- 能够识别典型条件并用规范语言说明判断依据
prerequisites:
- 初中阶段相关基础知识
- 基本阅读、表达与推理能力
common_mistakes:
- 只关注商品交换而忽略人员与观念流动
keywords:
- 贸易网络与文化传播
- 商路、贸易与文化交流
competency_tags:
- 时空观念
- 史料实证
- 历史解释
