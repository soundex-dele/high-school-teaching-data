id: history.senior-high.colonial-resistance
subject: history
education_stage: senior_high
name: 世界殖民体系与亚非拉民族独立运动
summary: 本知识点围绕殖民扩张与民族抗争展开，重点是理解世界殖民体系形成及亚非拉人民争取民族独立的实践，并能在新的问题情境中说明条件、过程与结论之间的联系。
objectives:
- 理解世界殖民体系形成及亚非拉人民争取民族独立的实践
- 能够识别典型条件并用规范语言说明判断依据
prerequisites:
- 初中阶段相关基础知识
- 基本阅读、表达与推理能力
common_mistakes:
- 把各地民族运动视为同一模式
keywords:
- 殖民扩张与民族抗争
- 世界殖民体系与亚非拉民族独立运动
competency_tags:
- 时空观念
- 史料实证
- 历史解释
