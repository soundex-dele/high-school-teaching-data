id: history.senior-high.population-culture
subject: history
education_stage: senior_high
name: 人口迁徙、文化交融与认同
summary: 本知识点围绕迁徙、交融与文化认同展开，重点是分析人口迁徙对文化传播、族群交融和认同建构的影响，并能在新的问题情境中说明条件、过程与结论之间的联系。
objectives:
- 分析人口迁徙对文化传播、族群交融和认同建构的影响
- 能够识别典型条件并用规范语言说明判断依据
prerequisites:
- 初中阶段相关基础知识
- 基本阅读、表达与推理能力
common_mistakes:
- 把文化交融理解为原有文化完全消失
keywords:
- 迁徙、交融与文化认同
- 人口迁徙、文化交融与认同
competency_tags:
- 时空观念
- 史料实证
- 历史解释
