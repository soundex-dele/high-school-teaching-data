id: history.senior-high.capitalist-system
subject: history
education_stage: senior_high
name: 资本主义制度的确立
summary: 本知识点围绕思想解放与制度变革展开，重点是理解思想解放、资产阶级革命和资本主义制度建立之间的联系，并能在新的问题情境中说明条件、过程与结论之间的联系。
objectives:
- 理解思想解放、资产阶级革命和资本主义制度建立之间的联系
- 能够识别典型条件并用规范语言说明判断依据
prerequisites:
- 初中阶段相关基础知识
- 基本阅读、表达与推理能力
common_mistakes:
- 把不同国家制度确立道路视为完全相同
keywords:
- 思想解放与制度变革
- 资本主义制度的确立
competency_tags:
- 时空观念
- 史料实证
- 历史解释
