id: math.senior-high.random-variable
subject: math
education_stage: senior_high
name: 随机变量及其分布
summary: 本知识点围绕离散型随机变量展开，重点是建立随机变量分布列并计算数字特征，理解常见概率模型，并能在新的问题情境中说明条件、过程与结论之间的联系。
objectives:
- 建立随机变量分布列并计算数字特征，理解常见概率模型
- 能够识别典型条件并用规范语言说明判断依据
prerequisites:
- 初中阶段相关基础知识
- 基本阅读、表达与推理能力
common_mistakes:
- 概率之和不为一或忽略随机变量取值范围
keywords:
- 离散型随机变量
- 随机变量及其分布
competency_tags:
- 数学抽象
- 逻辑推理
knowledge_items:
- id: distribution
  type: definition
  name: 离散型随机变量分布列
  content: 分布列列出随机变量所有可能取值及相应概率。
  review_status: self_checked
  formulas:
  - P(X=x_i)=p_i
  - \sum_ip_i=1
- id: expectation
  type: formula
  name: 数学期望
  content: 期望是随机变量取值按概率加权的平均。
  review_status: self_checked
  formulas:
  - E(X)=\sum_ix_ip_i
- id: variance
  type: formula
  name: 随机变量的方差
  content: 方差刻画随机变量取值相对期望的波动程度。
  review_status: self_checked
  formulas:
  - D(X)=\sum_i(x_i-E(X))^2p_i
- id: binomial
  type: formula
  name: 二项分布
  content: n 次独立重复试验中成功次数服从二项分布。
  review_status: self_checked
  formulas:
  - P(X=k)=C_n^kp^k(1-p)^{n-k}
  - E(X)=np
  - D(X)=np(1-p)
- id: normal
  type: model
  name: 正态分布
  content: 正态密度曲线关于均值对称，标准差控制数据分散程度。
  review_status: self_checked
  formulas:
  - X\sim N(\mu,\sigma^2)
review_status: self_checked
