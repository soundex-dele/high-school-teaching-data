name: 当代世界发展的特点与主要趋势
summary: 本知识点围绕多极化与全球化展开，重点是从和平发展、全球治理和人类共同挑战认识当代世界趋势，并能在新的问题情境中说明条件、过程与结论之间的联系。
objectives:
- 从和平发展、全球治理和人类共同挑战认识当代世界趋势
- 能够识别典型条件并用规范语言说明判断依据
