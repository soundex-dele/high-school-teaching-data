- id: history.pep.outline-1.prc-socialism.q2
  stem: 研究“中华人民共和国成立和社会主义革命与建设”时，下列学习方法最恰当的是（ ）。
  options:
  - id: A
    text: 结合时空背景、史料和因果关系综合分析
  - id: B
    text: 只背结论，不检查适用条件
  - id: C
    text: 只凭直觉，不使用证据
  - id: D
    text: 把局部现象直接推广为普遍规律
  correct_option_id: A
  explanation: 结合时空背景、史料和因果关系综合分析能够同时关注概念、条件与论证，是本知识点的有效学习方法。
  difficulty: basic
  tags:
  - 中华人民共和国成立和社会主义革命与建设
  - 新中国建立与社会主义建设
  source_type: original
- id: history.pep.outline-1.prc-socialism.q3
  stem: 关于“中华人民共和国成立和社会主义革命与建设”的学习，下列做法最需要避免的是（ ）。
  options:
  - id: A
    text: 先明确问题所处情境
  - id: B
    text: 用证据检验初步判断
  - id: C
    text: 完成后复核结论与条件
  - id: D
    text: 割裂成就、曲折与探索背景
  correct_option_id: D
  explanation: “割裂成就、曲折与探索背景”会造成典型理解偏差，其他做法都有助于形成可靠结论。
  difficulty: medium
  tags:
  - 中华人民共和国成立和社会主义革命与建设
  - 新中国建立与社会主义建设
  source_type: original
- id: history.pep.outline-1.prc-socialism.q4
  stem: 要达成“中华人民共和国成立和社会主义革命与建设”的学习目标，较合理的步骤是（ ）。
  options:
  - id: A
    text: 跳过条件，直接套用记忆中的结论
  - id: B
    text: 只完成一道例题，不总结方法
  - id: C
    text: 先明确关键概念，再分析关系，最后用新情境检验结论
  - id: D
    text: 先猜答案，再寻找支持猜测的片段
  correct_option_id: C
  explanation: 由概念到关系再到迁移检验，符合“认识政权巩固、制度建立和建设探索的成就、曲折及经验”所要求的认知过程。
  difficulty: medium
  tags:
  - 中华人民共和国成立和社会主义革命与建设
  - 新中国建立与社会主义建设
  source_type: original
- id: history.pep.outline-1.prc-socialism.q5
  stem: 把“中华人民共和国成立和社会主义革命与建设”迁移到新问题时，最可靠的判断依据是（ ）。
  options:
  - id: A
    text: 多数同学选择了同一选项
  - id: B
    text: 结论能够由明确条件和完整证据链支持
  - id: C
    text: 结论与熟悉题目的答案相同
  - id: D
    text: 表述中出现了本章关键词
  correct_option_id: B
  explanation: 迁移不是套用表面特征；只有条件明确、证据链完整，结论才具有可靠性。
  difficulty: advanced
