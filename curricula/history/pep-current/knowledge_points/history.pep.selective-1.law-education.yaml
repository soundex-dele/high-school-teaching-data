id: history.pep.selective-1.law-education
subject: history
curriculum_id: pep-history-current
name: 法律与教化
summary: 本知识点围绕法律体系与社会教化展开，重点是比较法律和教化在国家治理中的作用及互动，并能在新的问题情境中说明条件、过程与结论之间的联系。
objectives:
- 比较法律和教化在国家治理中的作用及互动
- 能够识别典型条件并用规范语言说明判断依据
prerequisites:
- 初中阶段相关基础知识
- 基本阅读、表达与推理能力
common_mistakes:
- 把法律与教化理解为彼此排斥
keywords:
- 法律体系与社会教化
- 法律与教化
competency_tags:
- 时空观念
- 史料实证
- 历史解释
review_status: self_checked
reference:
  publisher: 人民教育出版社
  edition_scope: 现行普通高中教科书
  chapter: 选择性必修1 国家制度与社会治理·法律与教化
questions:
- id: history.pep.selective-1.law-education.q1
  stem: 学习“法律与教化”时，最需要把握的核心内容是（ ）。
  options:
  - id: A
    text: 只关注书写格式
  - id: B
    text: 回避概念之间的联系
  - id: C
    text: 法律体系与社会教化
  - id: D
    text: 孤立记忆章节标题
  correct_option_id: C
  explanation: 该知识点的核心是“法律体系与社会教化”，其余选项都没有触及主要学习对象。
  difficulty: basic
  tags:
  - 法律与教化
  - 法律体系与社会教化
  source_type: original
- id: history.pep.selective-1.law-education.q2
  stem: 研究“法律与教化”时，下列学习方法最恰当的是（ ）。
  options:
  - id: A
    text: 把局部现象直接推广为普遍规律
  - id: B
    text: 结合时空背景、史料和因果关系综合分析
  - id: C
    text: 只背结论，不检查适用条件
  - id: D
    text: 只凭直觉，不使用证据
  correct_option_id: B
  explanation: 结合时空背景、史料和因果关系综合分析能够同时关注概念、条件与论证，是本知识点的有效学习方法。
  difficulty: basic
  tags:
  - 法律与教化
  - 法律体系与社会教化
  source_type: original
- id: history.pep.selective-1.law-education.q3
  stem: 关于“法律与教化”的学习，下列做法最需要避免的是（ ）。
  options:
  - id: A
    text: 把法律与教化理解为彼此排斥
  - id: B
    text: 先明确问题所处情境
  - id: C
    text: 用证据检验初步判断
  - id: D
    text: 完成后复核结论与条件
  correct_option_id: A
  explanation: “把法律与教化理解为彼此排斥”会造成典型理解偏差，其他做法都有助于形成可靠结论。
  difficulty: medium
  tags:
  - 法律与教化
  - 法律体系与社会教化
  source_type: original
- id: history.pep.selective-1.law-education.q4
  stem: 要达成“法律与教化”的学习目标，较合理的步骤是（ ）。
  options:
  - id: A
    text: 先猜答案，再寻找支持猜测的片段
  - id: B
    text: 跳过条件，直接套用记忆中的结论
  - id: C
    text: 只完成一道例题，不总结方法
  - id: D
    text: 先明确关键概念，再分析关系，最后用新情境检验结论
  correct_option_id: D
  explanation: 由概念到关系再到迁移检验，符合“比较法律和教化在国家治理中的作用及互动”所要求的认知过程。
  difficulty: medium
  tags:
  - 法律与教化
  - 法律体系与社会教化
  source_type: original
- id: history.pep.selective-1.law-education.q5
  stem: 把“法律与教化”迁移到新问题时，最可靠的判断依据是（ ）。
  options:
  - id: A
    text: 表述中出现了本章关键词
  - id: B
    text: 多数同学选择了同一选项
  - id: C
    text: 结论能够由明确条件和完整证据链支持
  - id: D
    text: 结论与熟悉题目的答案相同
  correct_option_id: C
  explanation: 迁移不是套用表面特征；只有条件明确、证据链完整，结论才具有可靠性。
  difficulty: advanced
  tags:
  - 法律与教化
  - 法律体系与社会教化
  source_type: original
