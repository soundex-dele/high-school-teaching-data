id: history.pep.selective-1.political-systems
subject: history
curriculum_id: pep-history-current
name: 政治制度
summary: 本知识点围绕中外政治制度演进展开，重点是比较政治制度形成、运行和变革，认识制度与国情的关系，并能在新的问题情境中说明条件、过程与结论之间的联系。
objectives:
- 比较政治制度形成、运行和变革，认识制度与国情的关系
- 能够识别典型条件并用规范语言说明判断依据
prerequisites:
- 初中阶段相关基础知识
- 基本阅读、表达与推理能力
common_mistakes:
- 脱离时代背景简单比较制度优劣
