id: history.pep.selective-3.heritage
subject: history
curriculum_id: pep-history-current
name: 文化传承的多种载体及其发展
summary: 本知识点围绕教育、书籍、博物馆与遗产展开，重点是认识文化传承载体演变及文化遗产保护的公共意义，并能在新的问题情境中说明条件、过程与结论之间的联系。
objectives:
- 认识文化传承载体演变及文化遗产保护的公共意义
- 能够识别典型条件并用规范语言说明判断依据
prerequisites:
- 初中阶段相关基础知识
- 基本阅读、表达与推理能力
common_mistakes:
- 把文化遗产保护等同于拒绝合理利用
keywords:
- 教育、书籍、博物馆与遗产
- 文化传承的多种载体及其发展
competency_tags:
- 时空观念
- 史料实证
- 历史解释
review_status: self_checked
reference:
  publisher: 人民教育出版社
  edition_scope: 现行普通高中教科书
  chapter: 选择性必修3 文化交流与传播·文化传承的多种载体及其发展
