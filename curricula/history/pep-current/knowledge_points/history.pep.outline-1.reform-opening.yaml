  - id: A
    text: 完成后复核结论与条件
  - id: B
    text: 把改革理解为单一领域或一次性政策调整
  - id: C
    text: 先明确问题所处情境
  - id: D
    text: 用证据检验初步判断
  correct_option_id: B
  explanation: “把改革理解为单一领域或一次性政策调整”会造成典型理解偏差，其他做法都有助于形成可靠结论。
  difficulty: medium
  tags:
  - 改革开放与社会主义现代化建设新时期
  - 改革开放与现代化
  source_type: original
- id: history.pep.outline-1.reform-opening.q4
  stem: 要达成“改革开放与社会主义现代化建设新时期”的学习目标，较合理的步骤是（ ）。
  options:
  - id: A
    text: 先明确关键概念，再分析关系，最后用新情境检验结论
  - id: B
