id: history.pep.outline-1.cpc-revolution
subject: history
curriculum_id: pep-history-current
name: 中国共产党成立与新民主主义革命兴起
summary: 本知识点围绕中国共产党与革命道路探索展开，重点是理解中国共产党成立、国民革命和革命道路探索之间的联系，并能在新的问题情境中说明条件、过程与结论之间的联系。
objectives:
- 理解中国共产党成立、国民革命和革命道路探索之间的联系
- 能够识别典型条件并用规范语言说明判断依据
prerequisites:
- 初中阶段相关基础知识
- 基本阅读、表达与推理能力
common_mistakes:
- 把革命道路形成看成一次性完成
keywords:
- 中国共产党与革命道路探索
- 中国共产党成立与新民主主义革命兴起
competency_tags:
- 时空观念
- 史料实证
- 历史解释
review_status: self_checked
reference:
  publisher: 人民教育出版社
  edition_scope: 现行普通高中教科书
  chapter: 中外历史纲要（上）·中国共产党成立与新民主主义革命兴起
