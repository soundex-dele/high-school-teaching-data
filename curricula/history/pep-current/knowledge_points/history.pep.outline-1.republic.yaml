questions:
- id: history.pep.outline-1.republic.q1
  stem: 学习“辛亥革命与中华民国的建立”时，最需要把握的核心内容是（ ）。
  options:
  - id: A
    text: 回避概念之间的联系
  - id: B
    text: 共和革命与民国初建
  - id: C
    text: 孤立记忆章节标题
  - id: D
    text: 只关注书写格式
  correct_option_id: B
  explanation: 该知识点的核心是“共和革命与民国初建”，其余选项都没有触及主要学习对象。
  difficulty: basic
  tags:
  - 辛亥革命与中华民国的建立
  - 共和革命与民国初建
  source_type: original
- id: history.pep.outline-1.republic.q2
  stem: 研究“辛亥革命与中华民国的建立”时，下列学习方法最恰当的是（ ）。
  options:
  - id: A
    text: 结合时空背景、史料和因果关系综合分析
  - id: B
    text: 只背结论，不检查适用条件
  - id: C
    text: 只凭直觉，不使用证据
  - id: D
    text: 把局部现象直接推广为普遍规律
  correct_option_id: A
  explanation: 结合时空背景、史料和因果关系综合分析能够同时关注概念、条件与论证，是本知识点的有效学习方法。
  difficulty: basic
  tags:
  - 辛亥革命与中华民国的建立
  - 共和革命与民国初建
  source_type: original
- id: history.pep.outline-1.republic.q3
  stem: 关于“辛亥革命与中华民国的建立”的学习，下列做法最需要避免的是（ ）。
  options:
  - id: A
    text: 先明确问题所处情境
  - id: B
    text: 用证据检验初步判断
  - id: C
    text: 完成后复核结论与条件
  - id: D
    text: 用是否立即改变社会性质作为唯一评价标准
  correct_option_id: D
  explanation: “用是否立即改变社会性质作为唯一评价标准”会造成典型理解偏差，其他做法都有助于形成可靠结论。
  difficulty: medium
  tags:
  - 辛亥革命与中华民国的建立
  - 共和革命与民国初建
  source_type: original
- id: history.pep.outline-1.republic.q4
  stem: 要达成“辛亥革命与中华民国的建立”的学习目标，较合理的步骤是（ ）。
  options:
  - id: A
    text: 跳过条件，直接套用记忆中的结论
  - id: B
    text: 只完成一道例题，不总结方法
  - id: C
    text: 先明确关键概念，再分析关系，最后用新情境检验结论
  - id: D
    text: 先猜答案，再寻找支持猜测的片段
  correct_option_id: C
  explanation: 由概念到关系再到迁移检验，符合“评价辛亥革命的历史意义与局限，理解民国初年政治变迁”所要求的认知过程。
  difficulty: medium
  tags:
  - 辛亥革命与中华民国的建立
  - 共和革命与民国初建
  source_type: original
- id: history.pep.outline-1.republic.q5
  stem: 把“辛亥革命与中华民国的建立”迁移到新问题时，最可靠的判断依据是（ ）。
  options:
  - id: A
    text: 多数同学选择了同一选项
  - id: B
    text: 结论能够由明确条件和完整证据链支持
  - id: C
    text: 结论与熟悉题目的答案相同
  - id: D
    text: 表述中出现了本章关键词
  correct_option_id: B
  explanation: 迁移不是套用表面特征；只有条件明确、证据链完整，结论才具有可靠性。
  difficulty: advanced
