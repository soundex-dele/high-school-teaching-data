  difficulty: medium
  tags:
  - 20世纪下半叶世界的新变化
  - 冷战、民族解放与社会变革
  source_type: original
- id: history.pep.outline-2.twentieth-century.q4
  stem: 要达成“20世纪下半叶世界的新变化”的学习目标，较合理的步骤是（ ）。
  options:
  - id: A
    text: 先明确关键概念，再分析关系，最后用新情境检验结论
  - id: B
    text: 先猜答案，再寻找支持猜测的片段
