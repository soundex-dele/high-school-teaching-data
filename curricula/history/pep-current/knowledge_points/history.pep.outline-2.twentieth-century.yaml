  explanation: 结合时空背景、史料和因果关系综合分析能够同时关注概念、条件与论证，是本知识点的有效学习方法。
  difficulty: basic
  tags:
  - 20世纪下半叶世界的新变化
  - 冷战、民族解放与社会变革
