  options:
  - id: A
    text: 只凭直觉，不使用证据
  - id: B
    text: 把局部现象直接推广为普遍规律
  - id: C
    text: 结合时空背景、史料和因果关系综合分析
  - id: D
    text: 只背结论，不检查适用条件
