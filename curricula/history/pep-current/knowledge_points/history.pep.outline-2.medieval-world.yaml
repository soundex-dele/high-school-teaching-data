id: history.pep.outline-2.medieval-world
subject: history
curriculum_id: pep-history-current
name: 中古时期的世界
summary: 本知识点围绕中古世界的区域发展展开，重点是比较欧洲、亚洲和非洲、美洲不同区域的政治经济文化，并能在新的问题情境中说明条件、过程与结论之间的联系。
objectives:
- 比较欧洲、亚洲和非洲、美洲不同区域的政治经济文化
- 能够识别典型条件并用规范语言说明判断依据
prerequisites:
- 初中阶段相关基础知识
- 基本阅读、表达与推理能力
common_mistakes:
- 把中古世界等同于欧洲历史
keywords:
- 中古世界的区域发展
- 中古时期的世界
competency_tags:
- 时空观念
- 史料实证
- 历史解释
review_status: self_checked
reference:
  publisher: 人民教育出版社
  edition_scope: 现行普通高中教科书
  chapter: 中外历史纲要（下）·中古时期的世界
questions:
- id: history.pep.outline-2.medieval-world.q1
  stem: 学习“中古时期的世界”时，最需要把握的核心内容是（ ）。
  options:
  - id: A
    text: 只关注书写格式
  - id: B
    text: 回避概念之间的联系
  - id: C
    text: 中古世界的区域发展
  - id: D
    text: 孤立记忆章节标题
  correct_option_id: C
  explanation: 该知识点的核心是“中古世界的区域发展”，其余选项都没有触及主要学习对象。
  difficulty: basic
  tags:
  - 中古时期的世界
  - 中古世界的区域发展
  source_type: original
- id: history.pep.outline-2.medieval-world.q2
  stem: 研究“中古时期的世界”时，下列学习方法最恰当的是（ ）。
  options:
  - id: A
    text: 把局部现象直接推广为普遍规律
  - id: B
    text: 结合时空背景、史料和因果关系综合分析
  - id: C
    text: 只背结论，不检查适用条件
  - id: D
    text: 只凭直觉，不使用证据
  correct_option_id: B
  explanation: 结合时空背景、史料和因果关系综合分析能够同时关注概念、条件与论证，是本知识点的有效学习方法。
  difficulty: basic
  tags:
  - 中古时期的世界
  - 中古世界的区域发展
  source_type: original
- id: history.pep.outline-2.medieval-world.q3
  stem: 关于“中古时期的世界”的学习，下列做法最需要避免的是（ ）。
  options:
  - id: A
    text: 把中古世界等同于欧洲历史
  - id: B
    text: 先明确问题所处情境
  - id: C
    text: 用证据检验初步判断
  - id: D
    text: 完成后复核结论与条件
  correct_option_id: A
  explanation: “把中古世界等同于欧洲历史”会造成典型理解偏差，其他做法都有助于形成可靠结论。
  difficulty: medium
  tags:
  - 中古时期的世界
  - 中古世界的区域发展
  source_type: original
- id: history.pep.outline-2.medieval-world.q4
  stem: 要达成“中古时期的世界”的学习目标，较合理的步骤是（ ）。
  options:
  - id: A
    text: 先猜答案，再寻找支持猜测的片段
  - id: B
    text: 跳过条件，直接套用记忆中的结论
  - id: C
    text: 只完成一道例题，不总结方法
  - id: D
    text: 先明确关键概念，再分析关系，最后用新情境检验结论
  correct_option_id: D
  explanation: 由概念到关系再到迁移检验，符合“比较欧洲、亚洲和非洲、美洲不同区域的政治经济文化”所要求的认知过程。
  difficulty: medium
  tags:
  - 中古时期的世界
  - 中古世界的区域发展
  source_type: original
- id: history.pep.outline-2.medieval-world.q5
  stem: 把“中古时期的世界”迁移到新问题时，最可靠的判断依据是（ ）。
  options:
  - id: A
    text: 表述中出现了本章关键词
  - id: B
    text: 多数同学选择了同一选项
  - id: C
    text: 结论能够由明确条件和完整证据链支持
  - id: D
    text: 结论与熟悉题目的答案相同
  correct_option_id: C
  explanation: 迁移不是套用表面特征；只有条件明确、证据链完整，结论才具有可靠性。
  difficulty: advanced
  tags:
  - 中古时期的世界
  - 中古世界的区域发展
  source_type: original
