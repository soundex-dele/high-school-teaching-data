- id: history.pep.selective-2.commerce-trade.q2
  stem: 研究“商业贸易与日常生活”时，下列学习方法最恰当的是（ ）。
  options:
  - id: A
    text: 把局部现象直接推广为普遍规律
  - id: B
    text: 结合时空背景、史料和因果关系综合分析
  - id: C
    text: 只背结论，不检查适用条件
  - id: D
    text: 只凭直觉，不使用证据
  correct_option_id: B
  explanation: 结合时空背景、史料和因果关系综合分析能够同时关注概念、条件与论证，是本知识点的有效学习方法。
  difficulty: basic
  tags:
  - 商业贸易与日常生活
  - 商业网络与生活变化
  source_type: original
- id: history.pep.selective-2.commerce-trade.q3
  stem: 关于“商业贸易与日常生活”的学习，下列做法最需要避免的是（ ）。
  options:
  - id: A
    text: 只关注商品数量而忽略制度与网络
  - id: B
    text: 先明确问题所处情境
  - id: C
    text: 用证据检验初步判断
  - id: D
    text: 完成后复核结论与条件
  correct_option_id: A
  explanation: “只关注商品数量而忽略制度与网络”会造成典型理解偏差，其他做法都有助于形成可靠结论。
  difficulty: medium
  tags:
  - 商业贸易与日常生活
  - 商业网络与生活变化
  source_type: original
- id: history.pep.selective-2.commerce-trade.q4
  stem: 要达成“商业贸易与日常生活”的学习目标，较合理的步骤是（ ）。
  options:
  - id: A
    text: 先猜答案，再寻找支持猜测的片段
  - id: B
    text: 跳过条件，直接套用记忆中的结论
  - id: C
    text: 只完成一道例题，不总结方法
  - id: D
    text: 先明确关键概念，再分析关系，最后用新情境检验结论
  correct_option_id: D
  explanation: 由概念到关系再到迁移检验，符合“理解商业、金融和世界市场发展如何改变社会生活”所要求的认知过程。
  difficulty: medium
  tags:
  - 商业贸易与日常生活
  - 商业网络与生活变化
  source_type: original
- id: history.pep.selective-2.commerce-trade.q5
  stem: 把“商业贸易与日常生活”迁移到新问题时，最可靠的判断依据是（ ）。
  options:
  - id: A
    text: 表述中出现了本章关键词
  - id: B
    text: 多数同学选择了同一选项
  - id: C
    text: 结论能够由明确条件和完整证据链支持
  - id: D
    text: 结论与熟悉题目的答案相同
  correct_option_id: C
  explanation: 迁移不是套用表面特征；只有条件明确、证据链完整，结论才具有可靠性。
  difficulty: advanced
