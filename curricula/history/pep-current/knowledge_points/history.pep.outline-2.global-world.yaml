questions:
- id: history.pep.outline-2.global-world.q1
  stem: 学习“走向整体的世界”时，最需要把握的核心内容是（ ）。
  options:
  - id: A
    text: 新航路与全球联系
  - id: B
    text: 孤立记忆章节标题
  - id: C
    text: 只关注书写格式
  - id: D
    text: 回避概念之间的联系
  correct_option_id: A
  explanation: 该知识点的核心是“新航路与全球联系”，其余选项都没有触及主要学习对象。
  difficulty: basic
  tags:
  - 走向整体的世界
  - 新航路与全球联系
  source_type: original
- id: history.pep.outline-2.global-world.q2
  stem: 研究“走向整体的世界”时，下列学习方法最恰当的是（ ）。
  options:
  - id: A
    text: 只背结论，不检查适用条件
  - id: B
    text: 只凭直觉，不使用证据
  - id: C
    text: 把局部现象直接推广为普遍规律
  - id: D
    text: 结合时空背景、史料和因果关系综合分析
  correct_option_id: D
  explanation: 结合时空背景、史料和因果关系综合分析能够同时关注概念、条件与论证，是本知识点的有效学习方法。
  difficulty: basic
  tags:
  - 走向整体的世界
  - 新航路与全球联系
  source_type: original
- id: history.pep.outline-2.global-world.q3
  stem: 关于“走向整体的世界”的学习，下列做法最需要避免的是（ ）。
  options:
  - id: A
    text: 用证据检验初步判断
  - id: B
    text: 完成后复核结论与条件
  - id: C
    text: 只从欧洲受益角度评价全球联系
  - id: D
    text: 先明确问题所处情境
  correct_option_id: C
  explanation: “只从欧洲受益角度评价全球联系”会造成典型理解偏差，其他做法都有助于形成可靠结论。
  difficulty: medium
  tags:
  - 走向整体的世界
  - 新航路与全球联系
  source_type: original
- id: history.pep.outline-2.global-world.q4
  stem: 要达成“走向整体的世界”的学习目标，较合理的步骤是（ ）。
  options:
  - id: A
    text: 只完成一道例题，不总结方法
  - id: B
    text: 先明确关键概念，再分析关系，最后用新情境检验结论
  - id: C
    text: 先猜答案，再寻找支持猜测的片段
  - id: D
    text: 跳过条件，直接套用记忆中的结论
  correct_option_id: B
  explanation: 由概念到关系再到迁移检验，符合“分析新航路开辟、早期殖民扩张和世界联系增强的多重影响”所要求的认知过程。
  difficulty: medium
  tags:
  - 走向整体的世界
  - 新航路与全球联系
  source_type: original
- id: history.pep.outline-2.global-world.q5
  stem: 把“走向整体的世界”迁移到新问题时，最可靠的判断依据是（ ）。
  options:
  - id: A
    text: 结论能够由明确条件和完整证据链支持
  - id: B
    text: 结论与熟悉题目的答案相同
  - id: C
    text: 表述中出现了本章关键词
  - id: D
    text: 多数同学选择了同一选项
  correct_option_id: A
  explanation: 迁移不是套用表面特征；只有条件明确、证据链完整，结论才具有可靠性。
  difficulty: advanced
  tags:
  - 走向整体的世界
  - 新航路与全球联系
  source_type: original
