id: history.pep.selective-1.ethnic-diplomacy
subject: history
curriculum_id: pep-history-current
name: 民族关系与国家关系
summary: 本知识点围绕民族治理与对外交往展开，重点是认识民族关系、边疆治理和外交制度与统一国家发展的联系，并能在新的问题情境中说明条件、过程与结论之间的联系。
objectives:
- 认识民族关系、边疆治理和外交制度与统一国家发展的联系
- 能够识别典型条件并用规范语言说明判断依据
prerequisites:
- 初中阶段相关基础知识
- 基本阅读、表达与推理能力
common_mistakes:
- 以现代国界观念机械解释古代关系
keywords:
- 民族治理与对外交往
- 民族关系与国家关系
competency_tags:
- 时空观念
- 史料实证
- 历史解释
