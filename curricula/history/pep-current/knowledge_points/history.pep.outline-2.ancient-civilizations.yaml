id: history.pep.outline-2.ancient-civilizations
subject: history
curriculum_id: pep-history-current
name: 古代文明的产生与发展
summary: 本知识点围绕多元古代文明展开，重点是比较不同自然和社会条件下古代文明及帝国的发展，并能在新的问题情境中说明条件、过程与结论之间的联系。
objectives:
- 比较不同自然和社会条件下古代文明及帝国的发展
- 能够识别典型条件并用规范语言说明判断依据
prerequisites:
- 初中阶段相关基础知识
- 基本阅读、表达与推理能力
common_mistakes:
- 用单线进化模式评价所有文明
keywords:
