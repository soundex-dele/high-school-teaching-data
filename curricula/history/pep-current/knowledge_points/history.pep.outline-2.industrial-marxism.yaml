  tags:
  - 工业革命与马克思主义的诞生
  - 工业化、社会转型与马克思主义
  source_type: original
- id: history.pep.outline-2.industrial-marxism.q4
  stem: 要达成“工业革命与马克思主义的诞生”的学习目标，较合理的步骤是（ ）。
  options:
  - id: A
    text: 跳过条件，直接套用记忆中的结论
  - id: B
    text: 只完成一道例题，不总结方法
