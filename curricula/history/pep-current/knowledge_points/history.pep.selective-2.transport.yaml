id: history.pep.selective-2.transport
subject: history
curriculum_id: pep-history-current
name: 交通与社会变迁
summary: 本知识点围绕交通网络与社会联系展开，重点是认识交通工具和道路网络对经济、政治与文化交流的影响，并能在新的问题情境中说明条件、过程与结论之间的联系。
objectives:
- 认识交通工具和道路网络对经济、政治与文化交流的影响
- 能够识别典型条件并用规范语言说明判断依据
prerequisites:
- 初中阶段相关基础知识
- 基本阅读、表达与推理能力
common_mistakes:
- 只讨论速度而忽略空间联系重组
keywords:
- 交通网络与社会联系
- 交通与社会变迁
competency_tags:
- 时空观念
- 史料实证
- 历史解释
