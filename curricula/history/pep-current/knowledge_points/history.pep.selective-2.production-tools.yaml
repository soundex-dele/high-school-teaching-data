id: history.pep.selective-2.production-tools
subject: history
curriculum_id: pep-history-current
name: 生产工具与劳作方式
summary: 本知识点围绕工具进步与劳作变迁展开，重点是分析生产工具、能源和组织方式变化对生产关系的影响，并能在新的问题情境中说明条件、过程与结论之间的联系。
objectives:
- 分析生产工具、能源和组织方式变化对生产关系的影响
- 能够识别典型条件并用规范语言说明判断依据
prerequisites:
- 初中阶段相关基础知识
- 基本阅读、表达与推理能力
common_mistakes:
- 用技术进步单因素解释全部社会变化
keywords:
- 工具进步与劳作变迁
- 生产工具与劳作方式
competency_tags:
- 时空观念
- 史料实证
- 历史解释
review_status: self_checked
reference:
  publisher: 人民教育出版社
  edition_scope: 现行普通高中教科书
  chapter: 选择性必修2 经济与社会生活·生产工具与劳作方式
questions:
- id: history.pep.selective-2.production-tools.q1
  stem: 学习“生产工具与劳作方式”时，最需要把握的核心内容是（ ）。
  options:
  - id: A
    text: 回避概念之间的联系
  - id: B
    text: 工具进步与劳作变迁
  - id: C
    text: 孤立记忆章节标题
  - id: D
    text: 只关注书写格式
  correct_option_id: B
  explanation: 该知识点的核心是“工具进步与劳作变迁”，其余选项都没有触及主要学习对象。
  difficulty: basic
  tags:
  - 生产工具与劳作方式
  - 工具进步与劳作变迁
  source_type: original
- id: history.pep.selective-2.production-tools.q2
  stem: 研究“生产工具与劳作方式”时，下列学习方法最恰当的是（ ）。
  options:
  - id: A
    text: 结合时空背景、史料和因果关系综合分析
  - id: B
    text: 只背结论，不检查适用条件
  - id: C
    text: 只凭直觉，不使用证据
  - id: D
    text: 把局部现象直接推广为普遍规律
  correct_option_id: A
  explanation: 结合时空背景、史料和因果关系综合分析能够同时关注概念、条件与论证，是本知识点的有效学习方法。
  difficulty: basic
  tags:
  - 生产工具与劳作方式
  - 工具进步与劳作变迁
  source_type: original
- id: history.pep.selective-2.production-tools.q3
  stem: 关于“生产工具与劳作方式”的学习，下列做法最需要避免的是（ ）。
  options:
  - id: A
    text: 先明确问题所处情境
  - id: B
    text: 用证据检验初步判断
  - id: C
    text: 完成后复核结论与条件
  - id: D
    text: 用技术进步单因素解释全部社会变化
  correct_option_id: D
  explanation: “用技术进步单因素解释全部社会变化”会造成典型理解偏差，其他做法都有助于形成可靠结论。
  difficulty: medium
  tags:
  - 生产工具与劳作方式
  - 工具进步与劳作变迁
  source_type: original
- id: history.pep.selective-2.production-tools.q4
  stem: 要达成“生产工具与劳作方式”的学习目标，较合理的步骤是（ ）。
  options:
  - id: A
    text: 跳过条件，直接套用记忆中的结论
  - id: B
    text: 只完成一道例题，不总结方法
  - id: C
    text: 先明确关键概念，再分析关系，最后用新情境检验结论
  - id: D
    text: 先猜答案，再寻找支持猜测的片段
  correct_option_id: C
  explanation: 由概念到关系再到迁移检验，符合“分析生产工具、能源和组织方式变化对生产关系的影响”所要求的认知过程。
  difficulty: medium
  tags:
  - 生产工具与劳作方式
  - 工具进步与劳作变迁
  source_type: original
- id: history.pep.selective-2.production-tools.q5
  stem: 把“生产工具与劳作方式”迁移到新问题时，最可靠的判断依据是（ ）。
  options:
  - id: A
    text: 多数同学选择了同一选项
  - id: B
    text: 结论能够由明确条件和完整证据链支持
  - id: C
    text: 结论与熟悉题目的答案相同
  - id: D
    text: 表述中出现了本章关键词
  correct_option_id: B
  explanation: 迁移不是套用表面特征；只有条件明确、证据链完整，结论才具有可靠性。
  difficulty: advanced
  tags:
  - 生产工具与劳作方式
  - 工具进步与劳作变迁
  source_type: original
