id: math.xj.required-2.vector
subject: math
curriculum_id: xj-math-current
name: 平面向量及其应用
summary: 本知识点围绕平面向量及运算展开，重点是从方向和大小理解向量，使用线性运算、数量积解决几何问题，并能在新的问题情境中说明条件、过程与结论之间的联系。
objectives:
- 从方向和大小理解向量，使用线性运算、数量积解决几何问题
- 能够识别典型条件并用规范语言说明判断依据
prerequisites:
- 初中阶段相关基础知识
- 基本阅读、表达与推理能力
common_mistakes:
- 把向量相等误认为起点和终点都相同
keywords:
- 平面向量及运算
- 平面向量及其应用
competency_tags:
- 数学抽象
- 逻辑推理
review_status: self_checked
reference:
  publisher: 湖南教育出版社
  edition_scope: 现行普通高中教科书
  chapter: 必修第二册·平面向量及其应用
