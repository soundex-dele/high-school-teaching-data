  source_type: original
- id: math.xj.required-2.vector.q3
  stem: 关于“平面向量及其应用”的学习，下列做法最需要避免的是（ ）。
  options:
  - id: A
    text: 先明确问题所处情境
  - id: B
    text: 用证据检验初步判断
  - id: C
    text: 完成后复核结论与条件
  - id: D
    text: 把向量相等误认为起点和终点都相同
  correct_option_id: D
  explanation: “把向量相等误认为起点和终点都相同”会造成典型理解偏差，其他做法都有助于形成可靠结论。
  difficulty: medium
  tags:
  - 平面向量及其应用
  - 平面向量及运算
  source_type: original
- id: math.xj.required-2.vector.q4
  stem: 要达成“平面向量及其应用”的学习目标，较合理的步骤是（ ）。
  options:
  - id: A
    text: 跳过条件，直接套用记忆中的结论
  - id: B
    text: 只完成一道例题，不总结方法
  - id: C
    text: 先明确关键概念，再分析关系，最后用新情境检验结论
  - id: D
