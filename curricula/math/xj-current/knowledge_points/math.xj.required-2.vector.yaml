- id: math.xj.required-2.vector.q2
  stem: 研究“平面向量及其应用”时，下列学习方法最恰当的是（ ）。
  options:
  - id: A
    text: 结合定义、图象和条件逐步推理
  - id: B
    text: 只背结论，不检查适用条件
  - id: C
    text: 只凭直觉，不使用证据
  - id: D
    text: 把局部现象直接推广为普遍规律
  correct_option_id: A
  explanation: 结合定义、图象和条件逐步推理能够同时关注概念、条件与论证，是本知识点的有效学习方法。
