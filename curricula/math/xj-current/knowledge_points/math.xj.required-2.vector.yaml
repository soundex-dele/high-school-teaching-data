  correct_option_id: C
  explanation: 由概念到关系再到迁移检验，符合“从方向和大小理解向量，使用线性运算、数量积解决几何问题”所要求的认知过程。
  difficulty: medium
  tags:
  - 平面向量及其应用
  - 平面向量及运算
  source_type: original
- id: math.xj.required-2.vector.q5
  stem: 把“平面向量及其应用”迁移到新问题时，最可靠的判断依据是（ ）。
  options:
  - id: A
    text: 多数同学选择了同一选项
  - id: B
    text: 结论能够由明确条件和完整证据链支持
  - id: C
