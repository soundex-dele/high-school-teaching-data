id: math.xj.selective-2.random-variable
subject: math
curriculum_id: xj-math-current
name: 随机变量及其分布
summary: 本知识点围绕离散型随机变量展开，重点是建立随机变量分布列并计算数字特征，理解常见概率模型，并能在新的问题情境中说明条件、过程与结论之间的联系。
objectives:
- 建立随机变量分布列并计算数字特征，理解常见概率模型
- 能够识别典型条件并用规范语言说明判断依据
prerequisites:
- 初中阶段相关基础知识
- 基本阅读、表达与推理能力
common_mistakes:
- 概率之和不为一或忽略随机变量取值范围
keywords:
- 离散型随机变量
- 随机变量及其分布
competency_tags:
- 数学抽象
- 逻辑推理
review_status: self_checked
reference:
  publisher: 湖南教育出版社
  edition_scope: 现行普通高中教科书
  chapter: 选择性必修第二册·随机变量及其分布
questions:
