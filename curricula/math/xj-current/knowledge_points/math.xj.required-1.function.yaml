id: math.xj.required-1.function
subject: math
curriculum_id: xj-math-current
name: 函数的概念与性质
summary: 本知识点围绕函数概念及基本性质展开，重点是从对应关系、定义域、值域理解函数并判断单调性、奇偶性和最值，并能在新的问题情境中说明条件、过程与结论之间的联系。
objectives:
- 从对应关系、定义域、值域理解函数并判断单调性、奇偶性和最值
- 能够识别典型条件并用规范语言说明判断依据
prerequisites:
- 初中阶段相关基础知识
- 基本阅读、表达与推理能力
common_mistakes:
- 只看解析式而忽略定义域
keywords:
- 函数概念及基本性质
- 函数的概念与性质
competency_tags:
- 数学抽象
- 逻辑推理
review_status: self_checked
reference:
  publisher: 湖南教育出版社
  edition_scope: 现行普通高中教科书
  chapter: 必修第一册·函数的概念与性质
questions:
- id: math.xj.required-1.function.q1
  stem: 学习“函数的概念与性质”时，最需要把握的核心内容是（ ）。
  options:
  - id: A
    text: 孤立记忆章节标题
  - id: B
    text: 只关注书写格式
  - id: C
    text: 回避概念之间的联系
  - id: D
    text: 函数概念及基本性质
  correct_option_id: D
  explanation: 该知识点的核心是“函数概念及基本性质”，其余选项都没有触及主要学习对象。
  difficulty: basic
  tags:
  - 函数的概念与性质
  - 函数概念及基本性质
  source_type: original
- id: math.xj.required-1.function.q2
  stem: 研究“函数的概念与性质”时，下列学习方法最恰当的是（ ）。
  options:
  - id: A
    text: 只凭直觉，不使用证据
  - id: B
    text: 把局部现象直接推广为普遍规律
  - id: C
    text: 结合定义、图象和条件逐步推理
  - id: D
    text: 只背结论，不检查适用条件
  correct_option_id: C
  explanation: 结合定义、图象和条件逐步推理能够同时关注概念、条件与论证，是本知识点的有效学习方法。
  difficulty: basic
  tags:
  - 函数的概念与性质
  - 函数概念及基本性质
  source_type: original
- id: math.xj.required-1.function.q3
  stem: 关于“函数的概念与性质”的学习，下列做法最需要避免的是（ ）。
  options:
  - id: A
    text: 完成后复核结论与条件
  - id: B
    text: 只看解析式而忽略定义域
  - id: C
    text: 先明确问题所处情境
  - id: D
    text: 用证据检验初步判断
  correct_option_id: B
  explanation: “只看解析式而忽略定义域”会造成典型理解偏差，其他做法都有助于形成可靠结论。
  difficulty: medium
  tags:
  - 函数的概念与性质
  - 函数概念及基本性质
  source_type: original
- id: math.xj.required-1.function.q4
  stem: 要达成“函数的概念与性质”的学习目标，较合理的步骤是（ ）。
  options:
  - id: A
    text: 先明确关键概念，再分析关系，最后用新情境检验结论
  - id: B
    text: 先猜答案，再寻找支持猜测的片段
  - id: C
    text: 跳过条件，直接套用记忆中的结论
  - id: D
    text: 只完成一道例题，不总结方法
  correct_option_id: A
  explanation: 由概念到关系再到迁移检验，符合“从对应关系、定义域、值域理解函数并判断单调性、奇偶性和最值”所要求的认知过程。
  difficulty: medium
  tags:
  - 函数的概念与性质
  - 函数概念及基本性质
  source_type: original
- id: math.xj.required-1.function.q5
  stem: 把“函数的概念与性质”迁移到新问题时，最可靠的判断依据是（ ）。
  options:
  - id: A
    text: 结论与熟悉题目的答案相同
  - id: B
    text: 表述中出现了本章关键词
  - id: C
    text: 多数同学选择了同一选项
  - id: D
    text: 结论能够由明确条件和完整证据链支持
  correct_option_id: D
  explanation: 迁移不是套用表面特征；只有条件明确、证据链完整，结论才具有可靠性。
  difficulty: advanced
  tags:
  - 函数的概念与性质
  - 函数概念及基本性质
  source_type: original
