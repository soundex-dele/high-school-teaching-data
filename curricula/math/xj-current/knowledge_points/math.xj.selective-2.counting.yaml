id: math.xj.selective-2.counting
subject: math
curriculum_id: xj-math-current
name: 计数原理
summary: 本知识点围绕分类、分步与排列组合展开，重点是根据事件过程选择分类或分步计数，并正确处理排列组合，并能在新的问题情境中说明条件、过程与结论之间的联系。
objectives:
- 根据事件过程选择分类或分步计数，并正确处理排列组合
- 能够识别典型条件并用规范语言说明判断依据
prerequisites:
- 初中阶段相关基础知识
- 基本阅读、表达与推理能力
common_mistakes:
- 重复计数或遗漏互斥分类
keywords:
- 分类、分步与排列组合
- 计数原理
competency_tags:
- 数学抽象
- 逻辑推理
knowledge_items:
- id: addition
  type: theorem
  name: 分类加法计数原理
  content: 完成一件事的各类办法互斥时，总方法数为各类方法数之和。
  review_status: self_checked
  formulas:
  - N=m_1+m_2+\cdots+m_k
  conditions:
  - 分类完整且互斥
  conclusion: 各类方法数相加。
- id: multiplication
  type: theorem
  name: 分步乘法计数原理
  content: 完成一件事需要依次完成各步骤时，总方法数为各步方法数之积。
  review_status: self_checked
  formulas:
  - N=m_1m_2\cdots m_k
  conditions:
  - 每个方案必须完成全部步骤
  conclusion: 各步方法数相乘。
- id: permutation
  type: formula
  name: 排列数
  content: 从 n 个不同元素中取出 m 个并按顺序排列。
  review_status: self_checked
  formulas:
  - A_n^m=\frac{n!}{(n-m)!}
- id: combination
  type: formula
  name: 组合数
  content: 从 n 个不同元素中取出 m 个组成一组，不计顺序。
  review_status: self_checked
  formulas:
  - C_n^m=\frac{n!}{m!(n-m)!}
- id: binomial
  type: theorem
  name: 二项式定理
  content: 二项式 n 次幂按组合数展开。
  review_status: self_checked
  formulas:
  - (a+b)^n=\sum_{k=0}^nC_n^ka^{n-k}b^k
  conditions:
  - n\in\mathbb N^*
  conclusion: 展开式共有 n+1 项。
review_status: self_checked
reference:
  publisher: 湖南教育出版社
  edition_scope: 现行普通高中教科书
  chapter: 选择性必修第二册·计数原理
questions:
- id: math.xj.selective-2.counting.q1
  stem: 学习“计数原理”时，最需要把握的核心内容是（ ）。
  options:
  - id: A
    text: 只关注书写格式
  - id: B
    text: 回避概念之间的联系
  - id: C
    text: 分类、分步与排列组合
  - id: D
    text: 孤立记忆章节标题
  correct_option_id: C
  explanation: 该知识点的核心是“分类、分步与排列组合”，其余选项都没有触及主要学习对象。
  difficulty: basic
  tags:
  - 计数原理
  - 分类、分步与排列组合
  source_type: original
- id: math.xj.selective-2.counting.q2
  stem: 研究“计数原理”时，下列学习方法最恰当的是（ ）。
  options:
  - id: A
    text: 把局部现象直接推广为普遍规律
  - id: B
    text: 结合定义、图象和条件逐步推理
  - id: C
    text: 只背结论，不检查适用条件
  - id: D
    text: 只凭直觉，不使用证据
  correct_option_id: B
  explanation: 结合定义、图象和条件逐步推理能够同时关注概念、条件与论证，是本知识点的有效学习方法。
  difficulty: basic
  tags:
  - 计数原理
  - 分类、分步与排列组合
  source_type: original
- id: math.xj.selective-2.counting.q3
  stem: 关于“计数原理”的学习，下列做法最需要避免的是（ ）。
  options:
  - id: A
    text: 重复计数或遗漏互斥分类
  - id: B
    text: 先明确问题所处情境
  - id: C
    text: 用证据检验初步判断
  - id: D
    text: 完成后复核结论与条件
  correct_option_id: A
  explanation: “重复计数或遗漏互斥分类”会造成典型理解偏差，其他做法都有助于形成可靠结论。
  difficulty: medium
  tags:
  - 计数原理
  - 分类、分步与排列组合
  source_type: original
- id: math.xj.selective-2.counting.q4
  stem: 要达成“计数原理”的学习目标，较合理的步骤是（ ）。
  options:
  - id: A
    text: 先猜答案，再寻找支持猜测的片段
  - id: B
    text: 跳过条件，直接套用记忆中的结论
  - id: C
    text: 只完成一道例题，不总结方法
  - id: D
    text: 先明确关键概念，再分析关系，最后用新情境检验结论
  correct_option_id: D
  explanation: 由概念到关系再到迁移检验，符合“根据事件过程选择分类或分步计数，并正确处理排列组合”所要求的认知过程。
  difficulty: medium
  tags:
  - 计数原理
  - 分类、分步与排列组合
  source_type: original
- id: math.xj.selective-2.counting.q5
  stem: 把“计数原理”迁移到新问题时，最可靠的判断依据是（ ）。
  options:
  - id: A
    text: 表述中出现了本章关键词
  - id: B
    text: 多数同学选择了同一选项
  - id: C
    text: 结论能够由明确条件和完整证据链支持
  - id: D
    text: 结论与熟悉题目的答案相同
  correct_option_id: C
  explanation: 迁移不是套用表面特征；只有条件明确、证据链完整，结论才具有可靠性。
  difficulty: advanced
  tags:
  - 计数原理
  - 分类、分步与排列组合
  source_type: original
