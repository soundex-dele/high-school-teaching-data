id: math.xj.selective-1.space-vector
subject: math
curriculum_id: xj-math-current
name: 空间向量与立体几何
summary: 本知识点围绕空间向量及坐标方法展开，重点是建立空间直角坐标系，用向量表示位置关系并计算角与距离，并能在新的问题情境中说明条件、过程与结论之间的联系。
objectives:
- 建立空间直角坐标系，用向量表示位置关系并计算角与距离
- 能够识别典型条件并用规范语言说明判断依据
prerequisites:
- 初中阶段相关基础知识
- 基本阅读、表达与推理能力
common_mistakes:
- 法向量方向选取错误或忽略夹角范围
keywords:
- 空间向量及坐标方法
- 空间向量与立体几何
competency_tags:
- 数学抽象
- 逻辑推理
review_status: self_checked
