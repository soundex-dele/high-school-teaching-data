id: math.xj.required-2.probability
subject: math
curriculum_id: xj-math-current
name: 概率
summary: 本知识点围绕随机事件与概率展开，重点是识别样本空间和事件关系，运用概率规则刻画随机现象，并能在新的问题情境中说明条件、过程与结论之间的联系。
objectives:
- 识别样本空间和事件关系，运用概率规则刻画随机现象
- 能够识别典型条件并用规范语言说明判断依据
prerequisites:
- 初中阶段相关基础知识
- 基本阅读、表达与推理能力
common_mistakes:
- 把互斥事件与独立事件混为一谈
keywords:
- 随机事件与概率
- 概率
competency_tags:
- 数学抽象
- 逻辑推理
knowledge_items:
- id: events
  type: definition
  name: 样本空间与随机事件
  content: 样本空间由全部可能结果构成，事件是样本空间的子集。
  review_status: self_checked
- id: addition
  type: theorem
  name: 概率加法公式
  content: 两个事件并集的概率需要扣除重复计算的交集。
  review_status: self_checked
  formulas:
  - P(A\cup B)=P(A)+P(B)-P(A\cap B)
  conditions: []
  conclusion: 给出任意两个事件并集的概率。
- id: conditional
  type: definition
  name: 条件概率
  content: 在事件 B 已发生条件下重新计算事件 A 的概率。
  review_status: self_checked
  formulas:
  - P(A\mid B)=\frac{P(A\cap B)}{P(B)}
  conditions:
  - P(B)>0
- id: independence
  type: theorem
  name: 事件独立性
  content: 独立事件同时发生的概率等于各自概率之积。
  review_status: self_checked
  formulas:
  - P(A\cap B)=P(A)P(B)
  conditions:
  - A 与 B 相互独立
  conclusion: A、B 同时发生的概率可相乘。
- id: total-probability
  type: formula
  name: 全概率公式
  content: 把复杂事件按互斥且完备的条件分解后求概率。
  review_status: self_checked
  formulas:
  - P(A)=\sum_iP(B_i)P(A\mid B_i)
  conditions:
  - \{B_i\}\text{ 构成样本空间的一个划分}
review_status: self_checked
reference:
  publisher: 湖南教育出版社
  edition_scope: 现行普通高中教科书
  chapter: 必修第二册·概率
questions:
- id: math.xj.required-2.probability.q1
  stem: 学习“概率”时，最需要把握的核心内容是（ ）。
  options:
  - id: A
    text: 孤立记忆章节标题
  - id: B
    text: 只关注书写格式
  - id: C
    text: 回避概念之间的联系
  - id: D
    text: 随机事件与概率
  correct_option_id: D
  explanation: 该知识点的核心是“随机事件与概率”，其余选项都没有触及主要学习对象。
  difficulty: basic
  tags:
  - 概率
  - 随机事件与概率
  source_type: original
- id: math.xj.required-2.probability.q2
  stem: 研究“概率”时，下列学习方法最恰当的是（ ）。
  options:
  - id: A
    text: 只凭直觉，不使用证据
  - id: B
    text: 把局部现象直接推广为普遍规律
  - id: C
    text: 结合定义、图象和条件逐步推理
  - id: D
    text: 只背结论，不检查适用条件
  correct_option_id: C
  explanation: 结合定义、图象和条件逐步推理能够同时关注概念、条件与论证，是本知识点的有效学习方法。
  difficulty: basic
  tags:
  - 概率
  - 随机事件与概率
  source_type: original
- id: math.xj.required-2.probability.q3
  stem: 关于“概率”的学习，下列做法最需要避免的是（ ）。
  options:
  - id: A
    text: 完成后复核结论与条件
  - id: B
    text: 把互斥事件与独立事件混为一谈
  - id: C
    text: 先明确问题所处情境
  - id: D
    text: 用证据检验初步判断
  correct_option_id: B
  explanation: “把互斥事件与独立事件混为一谈”会造成典型理解偏差，其他做法都有助于形成可靠结论。
  difficulty: medium
  tags:
  - 概率
  - 随机事件与概率
  source_type: original
- id: math.xj.required-2.probability.q4
  stem: 要达成“概率”的学习目标，较合理的步骤是（ ）。
  options:
  - id: A
    text: 先明确关键概念，再分析关系，最后用新情境检验结论
  - id: B
    text: 先猜答案，再寻找支持猜测的片段
  - id: C
    text: 跳过条件，直接套用记忆中的结论
  - id: D
    text: 只完成一道例题，不总结方法
  correct_option_id: A
  explanation: 由概念到关系再到迁移检验，符合“识别样本空间和事件关系，运用概率规则刻画随机现象”所要求的认知过程。
  difficulty: medium
  tags:
  - 概率
  - 随机事件与概率
  source_type: original
- id: math.xj.required-2.probability.q5
  stem: 把“概率”迁移到新问题时，最可靠的判断依据是（ ）。
  options:
  - id: A
    text: 结论与熟悉题目的答案相同
  - id: B
    text: 表述中出现了本章关键词
  - id: C
    text: 多数同学选择了同一选项
  - id: D
    text: 结论能够由明确条件和完整证据链支持
  correct_option_id: D
  explanation: 迁移不是套用表面特征；只有条件明确、证据链完整，结论才具有可靠性。
  difficulty: advanced
  tags:
  - 概率
  - 随机事件与概率
  source_type: original
