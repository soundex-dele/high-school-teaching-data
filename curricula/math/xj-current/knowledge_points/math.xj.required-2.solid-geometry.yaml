id: math.xj.required-2.solid-geometry
subject: math
curriculum_id: xj-math-current
name: 立体几何初步
summary: 本知识点围绕空间点线面关系展开，重点是借助空间图形、公理和判定定理研究平行与垂直，并能在新的问题情境中说明条件、过程与结论之间的联系。
objectives:
- 借助空间图形、公理和判定定理研究平行与垂直
- 能够识别典型条件并用规范语言说明判断依据
prerequisites:
- 初中阶段相关基础知识
- 基本阅读、表达与推理能力
common_mistakes:
- 仅凭直观图形下结论而缺少条件
keywords:
- 空间点线面关系
- 立体几何初步
competency_tags:
- 数学抽象
- 逻辑推理
knowledge_items:
- id: line-plane-parallel
  type: theorem
  name: 直线与平面平行判定
  content: 平面外一直线若平行于平面内一直线，则该直线平行于此平面。
  review_status: self_checked
  conditions:
  - 直线不在平面内
  - 平面内存在与之平行的直线
  conclusion: 直线与平面平行。
- id: planes-parallel
  type: theorem
  name: 平面与平面平行判定
  content: 一个平面内两条相交直线分别平行于另一平面，则两平面平行。
  review_status: self_checked
  conditions:
  - 两条直线相交
  - 两直线均平行于另一平面
  conclusion: 两个平面平行。
- id: line-plane-perpendicular
  type: theorem
  name: 直线与平面垂直判定
  content: 一直线若垂直于平面内两条相交直线，则垂直于此平面。
  review_status: self_checked
  conditions:
  - 平面内两条直线相交
  - 给定直线分别与二者垂直
  conclusion: 直线与平面垂直。
- id: volume
  type: formula
  name: 柱、锥体积
  content: 柱体体积等于底面积乘高，锥体体积是同底等高柱体的三分之一。
  review_status: self_checked
  formulas:
  - V_{柱}=Sh
  - V_{锥}=\frac13Sh
- id: sphere
  type: formula
  name: 球的表面积与体积
  content: 球的度量只由半径决定。
  review_status: self_checked
  formulas:
  - S=4\pi R^2
  - V=\frac43\pi R^3
review_status: self_checked
reference:
  publisher: 湖南教育出版社
  edition_scope: 现行普通高中教科书
  chapter: 必修第二册·立体几何初步
