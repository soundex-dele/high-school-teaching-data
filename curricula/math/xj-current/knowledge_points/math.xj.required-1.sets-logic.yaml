id: math.xj.required-1.sets-logic
subject: math
curriculum_id: xj-math-current
name: 集合与常用逻辑用语
summary: 本知识点围绕集合、命题和充分必要条件展开，重点是用元素与集合的关系、集合运算和逻辑联结词准确表达数学对象，并能在新的问题情境中说明条件、过程与结论之间的联系。
objectives:
- 用元素与集合的关系、集合运算和逻辑联结词准确表达数学对象
- 能够识别典型条件并用规范语言说明判断依据
prerequisites:
- 初中阶段相关基础知识
- 基本阅读、表达与推理能力
common_mistakes:
- 混淆元素与集合、充分条件与必要条件
keywords:
- 集合、命题和充分必要条件
- 集合与常用逻辑用语
competency_tags:
- 数学抽象
- 逻辑推理
knowledge_items:
- id: membership
  type: definition
  name: 元素与集合的关系
  content: 用属于和不属于描述对象与集合之间的关系。
  review_status: self_checked
  formulas:
  - a\in A
  - a\notin A
- id: set-operations
  type: formula
  name: 集合的交、并、补运算
  content: 交集取公共元素，并集汇总元素，补集依赖给定全集。
  review_status: self_checked
  formulas:
  - A\cap B
  - A\cup B
  - \complement_U A
- id: subset
  type: definition
  name: 子集与集合相等
  content: 若 A 的每个元素都属于 B，则 A 是 B 的子集；互为子集的集合相等。
  review_status: self_checked
  formulas:
  - A\subseteq B
  - A=B\iff A\subseteq B\land B\subseteq A
- id: implication
  type: definition
  name: 充分条件与必要条件
  content: 用命题间的推出关系判断充分性、必要性和充要性。
  review_status: self_checked
  formulas:
  - p\Rightarrow q
  - p\Leftrightarrow q
- id: demorgan
  type: theorem
  name: 集合的德摩根定律
  content: 取补会把并集与交集相互转换。
  review_status: self_checked
  formulas:
  - \complement_U(A\cup B)=(\complement_U A)\cap(\complement_U B)
  - \complement_U(A\cap B)=(\complement_U A)\cup(\complement_U B)
  conditions:
  - 全集 U 已确定
  conclusion: 并集的补等于补集的交，交集的补等于补集的并。
review_status: self_checked
reference:
  publisher: 湖南教育出版社
  edition_scope: 现行普通高中教科书
  chapter: 必修第一册·集合与常用逻辑用语
