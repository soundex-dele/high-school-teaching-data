  - id: A
    text: 收藏从宫廷私人走向公共展示，博物馆兼具研究教育与身份叙事功能
  - id: B
    text: 真实性、完整性和社区参与需要与旅游开发协调，保护不等于封闭
  - id: C
    text: 传承依赖实践者和生活语境，简单录制或商业包装不能替代活态延续
  - id: D
