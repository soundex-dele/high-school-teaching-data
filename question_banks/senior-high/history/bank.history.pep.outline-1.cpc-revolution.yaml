    text: 青年学生的爱国斗争推动马克思主义传播，并促进工人阶级登上政治舞台
  - id: B
    text: 国共合作推动反帝反军阀运动，北伐战争基本推翻北洋军阀统治
  - id: C
    text: 城市起义受挫后创建农村革命根据地，探索新的革命重心
  - id: D
    text: 把武装斗争、土地革命和根据地建设结合起来，形成适合中国国情的道路
  correct_option_id: B
