- id: history.pep.outline-2.capitalist-system.q3
  stem: 围绕“英国资产阶级革命”作历史解释，下列论述最准确的是（ ）。
  options:
  - id: A
    text: 废除封建特权和传播自由平等观念，革命进程却经历共和、帝制反复
  - id: B
    text: 以人文主义反对神学束缚，肯定人的价值但主要影响社会上层
  - id: C
    text: 议会限制王权，逐渐形成君主立宪制度而非彻底废除君主
  - id: D
    text: 摆脱殖民统治后通过宪法建立联邦共和制，并实行分权制衡
  correct_option_id: C
  explanation: “议会限制王权，逐渐形成君主立宪制度而非彻底废除君主”准确概括了“英国资产阶级革命”的时空背景、核心机制或历史影响；其余论述分别对应本章其他主题，不能替代该主题的解释。
  difficulty: medium
