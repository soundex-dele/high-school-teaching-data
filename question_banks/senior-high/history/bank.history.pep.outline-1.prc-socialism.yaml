- id: history.pep.outline-1.prc-socialism.q3
  stem: 围绕“社会主义基本制度建立”作历史解释，下列论述最准确的是（ ）。
  options:
  - id: A
    text: 新国家的成立结束半殖民地半封建社会，人民成为国家主人
  - id: B
    text: 三大改造基本完成，生产资料公有制占主体的经济基础建立
  - id: C
    text: 一五计划奠定工业化基础，后续探索既有严重曲折也有独立成果
  - id: D
    text: 应同时考察工业国防成就、民生进步与急躁冒进造成的教训
  correct_option_id: B
  explanation: “三大改造基本完成，生产资料公有制占主体的经济基础建立”准确概括了“社会主义基本制度建立”的时空背景、核心机制或历史影响；其余论述分别对应本章其他主题，不能替代该主题的解释。
