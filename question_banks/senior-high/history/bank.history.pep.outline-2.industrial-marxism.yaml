- id: history.pep.outline-2.industrial-marxism.q3
  stem: 围绕“工业社会生活变化”作历史解释，下列论述最准确的是（ ）。
  options:
  - id: A
    text: 机器生产从棉纺织业扩展，蒸汽动力推动工厂制度和铁路发展
  - id: B
    text: 生产力增长伴随城市化、阶级分化、环境污染和世界联系加强
  - id: C
    text: 工人通过罢工和政治运动争取权益，但早期斗争缺少科学理论指导
  - id: D
    text: 吸收德国哲学、英国政治经济学和法国社会主义成果，提出无产阶级解放理论
  correct_option_id: B
  explanation: “生产力增长伴随城市化、阶级分化、环境污染和世界联系加强”准确概括了“工业社会生活变化”的时空背景、核心机制或历史影响；其余论述分别对应本章其他主题，不能替代该主题的解释。
  difficulty: medium
