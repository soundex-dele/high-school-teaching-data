- id: history.pep.outline-1.late-qing.q3
  stem: 围绕“洋务运动”作历史解释，下列论述最准确的是（ ）。
  options:
  - id: A
    text: 战败后被迫开放通商口岸、协定关税，中国主权遭到破坏
  - id: B
    text: 以自强、求富为口号创办近代军事和民用企业，却未改变封建制度
  - id: C
    text: 战败和条约加深民族危机，列强掀起划分势力范围的浪潮
  - id: D
    text: 一场试图实行君主立宪的改革迅速失败，随后排外运动又遭八国联军镇压
  correct_option_id: B
  explanation: “以自强、求富为口号创办近代军事和民用企业，却未改变封建制度”准确概括了“洋务运动”的时空背景、核心机制或历史影响；其余论述分别对应本章其他主题，不能替代该主题的解释。
  difficulty: medium
