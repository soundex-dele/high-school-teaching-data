- id: history.pep.selective-2.village-city.q3
  stem: 围绕“近代城市化”作历史解释，下列论述最准确的是（ ）。
  options:
  - id: A
    text: 工业岗位吸引人口集中，城市扩张同时产生住房、卫生和交通问题
  - id: B
    text: 供水排污、公共空间和住房技术改善生活，也反映社会资源分配
  - id: C
    text: 可持续规划需协调人口、产业、交通与生态，不能只追求建筑规模
  - id: D
    text: 农业定居形成稳定聚落，布局受水源、耕地和防御条件影响
  correct_option_id: A
  explanation: “工业岗位吸引人口集中，城市扩张同时产生住房、卫生和交通问题”准确概括了“近代城市化”的时空背景、核心机制或历史影响；其余论述分别对应本章其他主题，不能替代该主题的解释。
