- id: history.pep.selective-3.commerce-culture.q3
  stem: 围绕“海上丝绸之路”作历史解释，下列论述最准确的是（ ）。
  options:
  - id: A
    text: 驼队和绿洲城市连接东西方，商品与宗教、艺术、技术共同流动
  - id: B
    text: 季风航海连接中国、东南亚、印度洋和非洲港口，形成多族群社群
  - id: C
    text: 工业化与殖民体系扩大贸易规模，文化传播也带有权力不平等
  - id: D
    text: 瓷器、茶等商品进入异域后被重新解释，体现物质流动与文化再造
  correct_option_id: B
  explanation: “季风航海连接中国、东南亚、印度洋和非洲港口，形成多族群社群”准确概括了“海上丝绸之路”的时空背景、核心机制或历史影响；其余论述分别对应本章其他主题，不能替代该主题的解释。
