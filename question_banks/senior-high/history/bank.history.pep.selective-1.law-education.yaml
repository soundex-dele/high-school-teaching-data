- id: history.pep.selective-1.law-education.q3
  stem: 围绕“宋元明清法律教化”作历史解释，下列论述最准确的是（ ）。
  options:
  - id: A
    text: 宪法法律体系与社会主义核心价值观建设相结合，体现依法治国与以德治国
  - id: B
    text: 秦重刑法，汉以后儒家伦理逐渐进入法律，礼法结合趋势形成
  - id: C
    text: 乡约、家训与法律相互配合，基层教化并不等同于国家强制
  - id: D
    text: 从习惯法、罗马法到近代法典和判例体系，形成不同法律传统
  correct_option_id: C
  explanation: “乡约、家训与法律相互配合，基层教化并不等同于国家强制”准确概括了“宋元明清法律教化”的时空背景、核心机制或历史影响；其余论述分别对应本章其他主题，不能替代该主题的解释。
