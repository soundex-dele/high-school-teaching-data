- id: history.pep.selective-3.population-culture.q3
  stem: 围绕“近代跨洲人口迁徙”作历史解释，下列论述最准确的是（ ）。
  options:
  - id: A
    text: 游牧与农耕人口移动推动技术、语言和制度交流，也伴随冲突
  - id: B
    text: 殖民、奴隶贸易和工业化造成跨洲流动，改变美洲人口结构
  - id: C
    text: 契约劳工在海外形成社群并连接中国与世界，同时经历歧视和抗争
  - id: D
    text: 移民常在保留传统与适应当地之间形成复合身份，而非完全同化
  correct_option_id: B
  explanation: “殖民、奴隶贸易和工业化造成跨洲流动，改变美洲人口结构”准确概括了“近代跨洲人口迁徙”的时空背景、核心机制或历史影响；其余论述分别对应本章其他主题，不能替代该主题的解释。
