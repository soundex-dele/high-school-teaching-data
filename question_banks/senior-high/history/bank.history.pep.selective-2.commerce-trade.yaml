- id: history.pep.selective-2.commerce-trade.q3
  stem: 围绕“货币信贷与金融”作历史解释，下列论述最准确的是（ ）。
  options:
  - id: A
    text: 商品丰富背后还有物流、支付、规则和信息网络，不能只看交易数量
  - id: B
    text: 集市、商路和货币促进区域交换，商人群体与信用方式逐渐发展
  - id: C
    text: 银行、证券、保险分散风险并汇集资本，也可能放大金融波动
  - id: D
    text: 百货公司、连锁经营到电子商务不断改变流通效率和消费体验
  correct_option_id: C
  explanation: “银行、证券、保险分散风险并汇集资本，也可能放大金融波动”准确概括了“货币信贷与金融”的时空背景、核心机制或历史影响；其余论述分别对应本章其他主题，不能替代该主题的解释。
