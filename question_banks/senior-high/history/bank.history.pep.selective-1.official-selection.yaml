- id: history.pep.selective-1.official-selection.q3
  stem: 围绕“古代官员考核监察”作历史解释，下列论述最准确的是（ ）。
  options:
  - id: A
    text: 常任文官通过考试进入政府并保持政治中立，以维持行政连续性
  - id: B
    text: 公务员制度强调公开考试、分类管理与为人民服务，具有本国政治属性
  - id: C
    text: 从军功授爵、察举到九品中正，选官标准在才能、品行和门第间变化
  - id: D
    text: 考课衡量政绩，御史等监察权力运行，但实际效果受政治环境制约
  correct_option_id: D
  explanation: “考课衡量政绩，御史等监察权力运行，但实际效果受政治环境制约”准确概括了“古代官员考核监察”的时空背景、核心机制或历史影响；其余论述分别对应本章其他主题，不能替代该主题的解释。
