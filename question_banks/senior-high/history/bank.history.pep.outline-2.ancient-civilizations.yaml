- id: history.pep.outline-2.ancient-civilizations.q3
  stem: 围绕“古代希腊文明”作历史解释，下列论述最准确的是（ ）。
  options:
  - id: A
    text: 通过战争和交通整合广大地区，法律与行政制度促进文明传播
  - id: B
    text: 各文明独立起源又通过战争、贸易和迁徙交往，不能用单一路径解释
  - id: C
    text: 大河灌溉农业、楔形文字和城邦发展，后来形成跨区域帝国
  - id: D
    text: 城邦公民政治与人文思想发展，但奴隶、妇女和外邦人没有公民权
  correct_option_id: D
  explanation: “城邦公民政治与人文思想发展，但奴隶、妇女和外邦人没有公民权”准确概括了“古代希腊文明”的时空背景、核心机制或历史影响；其余论述分别对应本章其他主题，不能替代该主题的解释。
