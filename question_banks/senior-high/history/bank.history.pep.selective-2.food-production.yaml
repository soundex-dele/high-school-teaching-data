- id: history.pep.selective-2.food-production.q3
  stem: 围绕“美洲作物全球传播”作历史解释，下列论述最准确的是（ ）。
  options:
  - id: A
    text: 食物增产不能单独保证安全，分配、价格、战争和气候同样影响获得
  - id: B
    text: 人类驯化动植物并定居，剩余产品、分工和社会分化随之出现
  - id: C
    text: 新航路后玉米、马铃薯等跨洲传播，改变人口承载力与饮食结构
  - id: D
    text: 机械化、化肥和冷链提高产量与供应稳定性，也带来生态和安全议题
  correct_option_id: C
  explanation: “新航路后玉米、马铃薯等跨洲传播，改变人口承载力与饮食结构”准确概括了“美洲作物全球传播”的时空背景、核心机制或历史影响；其余论述分别对应本章其他主题，不能替代该主题的解释。
