- id: history.pep.selective-2.production-tools.q3
  stem: 围绕“机器大生产”作历史解释，下列论述最准确的是（ ）。
  options:
  - id: A
    text: 石器到铁制农具提高效率，畜力和水利配合推动精耕农业
  - id: B
    text: 蒸汽机、电力和内燃机使生产从手工转向机器大工业
  - id: C
    text: 流水线、数字控制和人工智能提升标准化与柔性生产能力
  - id: D
    text: 工具变化与资本、劳动组织相互作用，技术并非社会变迁的唯一原因
  correct_option_id: B
  explanation: “蒸汽机、电力和内燃机使生产从手工转向机器大工业”准确概括了“机器大生产”的时空背景、核心机制或历史影响；其余论述分别对应本章其他主题，不能替代该主题的解释。
