- id: history.pep.outline-1.three-kingdoms-sui-tang.q3
  stem: 围绕“隋朝统一与制度建设”作历史解释，下列论述最准确的是（ ）。
  options:
  - id: A
    text: 多个政权并立，江南得到开发，北方民族政权推进封建化改革
  - id: B
    text: 结束长期分裂，创立科举制并开通贯通南北的大运河
  - id: C
    text: 三省六部制提高决策规范性，均田制和租庸调制支撑国家财政
  - id: D
    text: 长安汇聚各国使者商人，佛教中国化并出现多元开放的文学艺术
  correct_option_id: B
  explanation: “结束长期分裂，创立科举制并开通贯通南北的大运河”准确概括了“隋朝统一与制度建设”的时空背景、核心机制或历史影响；其余论述分别对应本章其他主题，不能替代该主题的解释。
