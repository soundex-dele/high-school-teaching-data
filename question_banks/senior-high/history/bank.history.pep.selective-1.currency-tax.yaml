- id: history.pep.selective-1.currency-tax.q3
  stem: 围绕“中国古代赋役制度”作历史解释，下列论述最准确的是（ ）。
  options:
  - id: A
    text: 关税自主逐步恢复，个人所得税等现代税种服务财政与收入调节
  - id: B
    text: 由天然货币到金属铸币、纸币，币制统一与信用问题长期并存
  - id: C
    text: 从人头税、土地税到折银征收，征税依据和国家控制方式不断调整
  - id: D
    text: 废除人头税并把赋役并入田地，有助于减轻国家对人口的直接控制
  correct_option_id: C
  explanation: “从人头税、土地税到折银征收，征税依据和国家控制方式不断调整”准确概括了“中国古代赋役制度”的时空背景、核心机制或历史影响；其余论述分别对应本章其他主题，不能替代该主题的解释。
