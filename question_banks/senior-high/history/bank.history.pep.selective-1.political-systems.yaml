- id: history.pep.selective-1.political-systems.q3
  stem: 围绕“古希腊罗马政治制度”作历史解释，下列论述最准确的是（ ）。
  options:
  - id: A
    text: 郡县制取代分封趋势，中央官制与地方治理共同服务大一统国家
  - id: B
    text: 雅典公民直接参与而罗马发展法律治理，两者都受特定公民范围限制
  - id: C
    text: 代议制在不同国情下形成君主立宪或共和等多种制度形态
  - id: D
    text: 近代制度探索从共和受挫到人民代表大会制度建立，反映道路选择变化
  correct_option_id: B
  explanation: “雅典公民直接参与而罗马发展法律治理，两者都受特定公民范围限制”准确概括了“古希腊罗马政治制度”的时空背景、核心机制或历史影响；其余论述分别对应本章其他主题，不能替代该主题的解释。
