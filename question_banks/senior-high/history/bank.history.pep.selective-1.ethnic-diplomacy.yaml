- id: history.pep.selective-1.ethnic-diplomacy.q3
  stem: 围绕“中国古代对外交往”作历史解释，下列论述最准确的是（ ）。
  options:
  - id: A
    text: 和亲、会盟、战争和互市并存，民族交往不能简化为单一冲突关系
  - id: B
    text: 朝贡体系具有政治礼仪与贸易功能，不能直接套用现代外交概念
  - id: C
    text: 从总理衙门到外交部，近代中国被迫转入条约体系并建设现代外交机构
  - id: D
    text: 独立自主和平外交从和平共处五项原则发展到参与全球治理
  correct_option_id: B
  explanation: “朝贡体系具有政治礼仪与贸易功能，不能直接套用现代外交概念”准确概括了“中国古代对外交往”的时空背景、核心机制或历史影响；其余论述分别对应本章其他主题，不能替代该主题的解释。
