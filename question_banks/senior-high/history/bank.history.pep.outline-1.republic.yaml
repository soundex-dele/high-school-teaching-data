- id: history.pep.outline-1.republic.q3
  stem: 围绕“中华民国建立”作历史解释，下列论述最准确的是（ ）。
  options:
  - id: A
    text: 清政府新政未能挽救统治，铁路国有政策进一步激化社会矛盾
  - id: B
    text: 亚洲第一个共和制国家建立，但革命成果很快被袁世凯窃取
  - id: C
    text: 确立主权在民、责任内阁等原则，意在限制袁世凯专权
  - id: D
    text: 袁世凯称帝失败后军阀割据，维护共和法统的斗争仍未完成民主政治
  correct_option_id: B
  explanation: “亚洲第一个共和制国家建立，但革命成果很快被袁世凯窃取”准确概括了“中华民国建立”的时空背景、核心机制或历史影响；其余论述分别对应本章其他主题，不能替代该主题的解释。
