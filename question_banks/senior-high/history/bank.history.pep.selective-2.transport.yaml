- id: history.pep.selective-2.transport.q3
  stem: 围绕“铁路与轮船”作历史解释，下列论述最准确的是（ ）。
  options:
  - id: A
    text: 驿道、车马和运河服务军事行政与贸易，通行能力受地形和政权影响
  - id: B
    text: 铁路压缩旅行时间并重组资源和城市布局，也是国家能力的重要体现
  - id: C
    text: 汽车、航空和高速铁路形成综合网络，但也产生能源与环境成本
  - id: D
    text: 交通改善会改变区位优势、人口流动和文化交流，而不只是提高速度
  correct_option_id: B
  explanation: “铁路压缩旅行时间并重组资源和城市布局，也是国家能力的重要体现”准确概括了“铁路与轮船”的时空背景、核心机制或历史影响；其余论述分别对应本章其他主题，不能替代该主题的解释。
