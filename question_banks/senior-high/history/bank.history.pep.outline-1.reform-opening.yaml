- id: history.pep.outline-1.reform-opening.q3
  stem: 围绕“对外开放格局”作历史解释，下列论述最准确的是（ ）。
  options:
  - id: A
    text: 市场在资源配置中的作用逐步增强，同时坚持社会主义基本制度
  - id: B
    text: 脱贫攻坚、科技创新与国家治理现代化体现道路在新时代的持续发展
  - id: C
    text: 思想路线得到重新确立，党和国家工作中心转向经济建设
  - id: D
    text: 经济特区到沿海开放城市再到内地，形成多层次开放格局
  correct_option_id: D
  explanation: “经济特区到沿海开放城市再到内地，形成多层次开放格局”准确概括了“对外开放格局”的时空背景、核心机制或历史影响；其余论述分别对应本章其他主题，不能替代该主题的解释。
