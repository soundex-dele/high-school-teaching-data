- id: history.pep.selective-3.war-culture.q3
  stem: 围绕“近代殖民战争”作历史解释，下列论述最准确的是（ ）。
  options:
  - id: A
    text: 战后记忆、审判与和解共同塑造认同，文化影响不是胜者单向灌输
  - id: B
    text: 帝国征服破坏城市人口，也可能带来语言、宗教和制度跨区域传播
  - id: C
    text: 殖民者以武力推行制度文化，被征服者通过抵抗和改造保持主体性
  - id: D
    text: 总体战摧毁文化遗产并迫使知识人才迁移，也催生国际保护规则
  correct_option_id: C
