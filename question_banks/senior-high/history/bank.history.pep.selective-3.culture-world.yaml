- id: history.pep.selective-3.culture-world.q3
  stem: 围绕“南亚文化”作历史解释，下列论述最准确的是（ ）。
  options:
  - id: A
    text: 印度宗教、文学和数学成就广泛传播，并与本地社会结构相互作用
  - id: B
    text: 中华文化辐射朝鲜、日本、越南，各地吸收后形成自身制度文化
  - id: C
    text: 玛雅历法、阿兹特克城市和印加道路显示美洲文明独立发展的创造力
  - id: D
    text: 两河、埃及、希伯来等传统在宗教、文字和法律方面影响深远
  correct_option_id: A
  explanation: “印度宗教、文学和数学成就广泛传播，并与本地社会结构相互作用”准确概括了“南亚文化”的时空背景、核心机制或历史影响；其余论述分别对应本章其他主题，不能替代该主题的解释。
