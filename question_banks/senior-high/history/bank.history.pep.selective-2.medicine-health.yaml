- id: history.pep.selective-2.medicine-health.q3
  stem: 围绕“疫病与社会”作历史解释，下列论述最准确的是（ ）。
  options:
  - id: A
    text: 经验积累形成针灸、本草等体系，其历史价值应置于当时知识条件评价
  - id: B
    text: 黑死病、天花等冲击人口经济，也促使隔离和防疫制度发展
  - id: C
    text: 清洁供水、疫苗接种和疾病监测把健康从个人诊疗扩展为公共治理
  - id: D
    text: 医保分担疾病经济风险并改善可及性，但仍需处理公平与成本问题
  correct_option_id: B
  explanation: “黑死病、天花等冲击人口经济，也促使隔离和防疫制度发展”准确概括了“疫病与社会”的时空背景、核心机制或历史影响；其余论述分别对应本章其他主题，不能替代该主题的解释。
