- id: math.xj.selective-1.line-circle.q1
  stem: 过点 (1,2) 且斜率为 3 的直线方程是（ ）。
  options:
  - id: A
    text: 3y=x+5
  - id: B
    text: y-2=3(x-1)
  - id: C
    text: y-1=3(x-2)
  - id: D
    text: y+2=3(x+1)
  correct_option_id: B
  explanation: 由点斜式 y-y₀=k(x-x₀)，得 y-2=3(x-1)。
  difficulty: basic
