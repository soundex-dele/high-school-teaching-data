- id: math.xj.selective-1.line-circle.q2
  stem: 点 (2,-1) 到直线 3x+4y-5=0 的距离为（ ）。
  options:
  - id: A
    text: 3/5
  - id: B
    text: 1/5
  - id: C
    text: '1'
  - id: D
    text: '5'
  correct_option_id: A
  explanation: 距离为 |3×2+4×(-1)-5|/√(3²+4²)=3/5。
