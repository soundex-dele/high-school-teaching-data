- id: math.xj.required-2.probability.q4
  stem: 已知 P(A)=0.5，P(B)=0.4，P(AB)=0.2，则 A 与 B（ ）。
  options:
  - id: A
    text: 既互斥又独立
  - id: B
    text: 既不互斥也不独立
  - id: C
    text: 独立但不互斥
  - id: D
    text: 互斥但不独立
  correct_option_id: C
  explanation: P(A)P(B)=0.2=P(AB)，故独立；但 P(AB)>0，所以不互斥。
  difficulty: medium
