- id: math.xj.required-2.probability.q5
  stem: 某检测对患病者呈阳性的概率为 0.9，对未患病者误报阳性的概率为 0.1。人群患病率为 0.01，随机一人检测阳性，则其实际患病概率约为（ ）。
  options:
  - id: A
    text: '0.99'
  - id: B
    text: '0.083'
  - id: C
    text: '0.5'
  - id: D
    text: '0.9'
  correct_option_id: B
  explanation: 由全概率与贝叶斯公式，所求为 0.01×0.9/(0.01×0.9+0.99×0.1)≈0.083。
  difficulty: advanced
