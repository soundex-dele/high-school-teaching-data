- id: math.xj.required-2.statistics.q4
  stem: 两组数据均值相同，甲组标准差为 2，乙组标准差为 5。由此可知（ ）。
  options:
  - id: A
    text: 甲组数据更集中
  - id: B
    text: 乙组数据更集中
  - id: C
    text: 甲组均值更可靠
  - id: D
    text: 乙组样本量更大
  correct_option_id: A
  explanation: 标准差越小，数据围绕均值的波动越小；标准差不能直接说明样本量或均值可靠性。
