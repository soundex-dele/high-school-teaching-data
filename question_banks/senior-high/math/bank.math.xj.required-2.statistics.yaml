- id: math.xj.required-2.statistics.q3
  stem: 某校按高一、高二、高三人数之比 5:4:3 分层抽取 120 人，则高三应抽取（ ）。
  options:
  - id: A
    text: 50 人
  - id: B
    text: 30 人
  - id: C
    text: 36 人
  - id: D
    text: 40 人
  correct_option_id: B
  explanation: 高三占 3/(5+4+3)=1/4，应抽取 120×1/4=30 人。
  difficulty: medium
