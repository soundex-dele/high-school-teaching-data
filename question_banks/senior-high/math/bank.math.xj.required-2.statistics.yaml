- id: math.xj.required-2.statistics.q2
  stem: 一组数据每个数都加 5，则保持不变的统计量是（ ）。
  options:
  - id: A
    text: 中位数
  - id: B
    text: 众数
  - id: C
    text: 方差
  - id: D
    text: 平均数
  correct_option_id: C
  explanation: 整体平移不改变各数据与平均数的离差，因此方差不变；位置类统计量均增加 5。
  difficulty: basic
