- id: math.xj.required-2.statistics.q5
  stem: 调查“全市高中生每天运动时间”，下列抽样最可能造成系统偏差的是（ ）。
  options:
  - id: A
    text: 按学校分层后随机抽取
  - id: B
    text: 从全市学籍号中随机抽取
  - id: C
    text: 按各区人数比例随机抽取
  - id: D
    text: 只在一所体育特色学校抽取
  correct_option_id: D
  explanation: 体育特色学校学生的运动习惯可能显著不同，不能代表全市高中生，容易产生选择偏差。
