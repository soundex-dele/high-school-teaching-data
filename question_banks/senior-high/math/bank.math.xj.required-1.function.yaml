- id: math.xj.required-1.function.q3
  stem: 函数 f(x)=x²-4x+5 在区间 [0,5] 上的最小值为（ ）。
  options:
  - id: A
    text: '-1'
  - id: B
    text: '0'
  - id: C
    text: '5'
  - id: D
    text: '1'
  correct_option_id: D
  explanation: f(x)=(x-2)²+1，顶点 x=2 位于给定区间内，故最小值为 1。
