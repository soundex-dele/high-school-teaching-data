- id: math.xj.required-1.function.q5
  stem: 定义 f(x)=x+2（x<0），f(x)=x²（x≥0）。方程 f(x)=1 的实数解个数为（ ）。
  options:
  - id: A
    text: '3'
  - id: B
    text: '2'
  - id: C
    text: '0'
  - id: D
    text: '1'
  correct_option_id: B
  explanation: x<0 时 x+2=1 得 x=-1；x≥0 时 x²=1 得 x=1，共两个有效解。
