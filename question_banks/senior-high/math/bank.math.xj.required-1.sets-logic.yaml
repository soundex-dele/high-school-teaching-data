- id: math.xj.required-1.sets-logic.q1
  stem: 已知集合 A={1,2,3}，B={2,3,4}，则 A∩B 等于（ ）。
  options:
  - id: A
    text: '{1,2,4}'
  - id: B
    text: '{2,3}'
  - id: C
    text: '{1,4}'
  - id: D
    text: '{1,2,3,4}'
  correct_option_id: B
  explanation: 交集只保留同时属于 A 和 B 的元素，所以 A∩B={2,3}。
  difficulty: basic
