- id: math.xj.required-1.sets-logic.q5
  stem: 命题“对任意实数 x，都有 x²+x+1>0”的否定是（ ）。
  options:
  - id: A
    text: 对任意实数 x，都有 x²+x+1≠0
  - id: B
    text: 存在实数 x，使 x²+x+1≤0
  - id: C
    text: 对任意实数 x，都有 x²+x+1≤0
  - id: D
    text: 存在实数 x，使 x²+x+1>0
  correct_option_id: B
  explanation: 全称命题的否定是存在性命题，同时否定结论；“>0”的否定是“≤0”。
  difficulty: advanced
