- id: math.xj.required-1.sets-logic.q4
  stem: 若 A⊆B，B⊆C，且存在元素 c∈C 但 c∉A，则一定正确的是（ ）。
  options:
  - id: A
    text: B=C
  - id: B
    text: c∉B
