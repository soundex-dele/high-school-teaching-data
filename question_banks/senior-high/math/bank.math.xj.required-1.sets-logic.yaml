- id: math.xj.required-1.sets-logic.q2
  stem: 命题 p：x>2，q：x²>4（x∈R）。p 是 q 的（ ）。
  options:
  - id: A
    text: 充分不必要条件
  - id: B
    text: 必要不充分条件
  - id: C
    text: 充要条件
  - id: D
    text: 既不充分也不必要条件
  correct_option_id: A
  explanation: x>2 一定推出 x²>4；但 x=-3 时 q 成立而 p 不成立，因此 p 是 q 的充分不必要条件。
  difficulty: basic
