- id: math.xj.required-1.exp-log.q5
  stem: 设 f(x)=log₂(x-1)。若 f(x)+f(5-x)=1，则 x 的取值为（ ）。
  options:
  - id: A
    text: 2 或 4
  - id: B
    text: 3±√2
  - id: C
    text: 1 或 4
  - id: D
    text: 2 或 3
  correct_option_id: D
  explanation: 定义域要求 1<x<4。合并对数得 (x-1)(4-x)=2，即 x²-5x+6=0，解得 x=2 或 x=3，均符合定义域。
  difficulty: advanced
