- id: math.xj.required-1.trigonometry.q3
  stem: 函数 y=2sin(2x+π/3) 的最小正周期为（ ）。
  options:
  - id: A
    text: π/2
  - id: B
    text: 4π
  - id: C
    text: π
  - id: D
    text: 2π
  correct_option_id: C
  explanation: sin(ωx+φ) 的周期为 2π/|ω|，这里 ω=2，所以周期为 π。
  difficulty: medium
