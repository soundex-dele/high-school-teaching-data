- id: math.xj.required-1.trigonometry.q4
  stem: 要把 y=sin 2x 的图象向左平移 π/6，所得函数为（ ）。
  options:
  - id: A
    text: y=sin(2x-π/3)
  - id: B
    text: y=sin(2x+π/3)
  - id: C
    text: y=sin(2x+π/6)
  - id: D
    text: y=sin(2x-π/6)
  correct_option_id: B
  explanation: 横向左移 π/6 应将 x 换为 x+π/6，故相位增加 2×π/6=π/3。
  difficulty: medium
  tags:
