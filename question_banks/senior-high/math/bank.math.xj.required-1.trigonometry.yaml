- id: math.xj.required-1.trigonometry.q5
  stem: 在△ABC中，a=√3，b=1，A=60°，则角 B 的可能值个数为（ ）。
  options:
  - id: A
    text: '1'
  - id: B
    text: '0'
  - id: C
    text: '2'
  - id: D
    text: '3'
  correct_option_id: A
  explanation: 由正弦定理 sin B=b sin A/a=1/2。B 可为 30° 或 150°，但 A+B<180° 排除 150°，故只有一个。
  difficulty: advanced
