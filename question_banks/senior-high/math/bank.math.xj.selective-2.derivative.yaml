- id: math.xj.selective-2.derivative.q3
  stem: 函数 f(x)=x³-3x 在区间 (-1,1) 上（ ）。
  options:
  - id: A
    text: 先增后减
  - id: B
    text: 先减后增
  - id: C
    text: 单调递减
  - id: D
    text: 单调递增
  correct_option_id: C
  explanation: f'(x)=3x²-3<0 在 (-1,1) 内成立，因此严格递减。
  difficulty: medium
