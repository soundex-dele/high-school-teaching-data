- id: math.xj.selective-2.derivative.q4
  stem: 若函数 f 在 x=0 处有 f'(0)=0，则下列判断一定正确的是（ ）。
  options:
  - id: A
    text: f 在 0 两侧单调性改变
  - id: B
    text: x=0 是驻点
  - id: C
    text: x=0 是极大值点
  - id: D
    text: x=0 是极小值点
  correct_option_id: B
  explanation: 导数为 0 只能说明该点是驻点；是否为极值还要考察导数变号等条件。
